<script src="assets/data.js"></script>
<script src="assets/app.js"></script>
<script>
boot('agenda');

/* ---------- Estado de la vista ---------- */
const V = {
  vista: 'semana',            // dia | semana | mes
  ancla: new Date(),          // fecha de referencia
  estados: new Set(ESTADO_ORDER),
  tecnico: '',
  cliente: '',
  tipo: '',
  soloUrgentes: false,
};
V.ancla.setHours(0, 0, 0, 0);

const H_INI = 6, H_FIN = 21, PX_H = 46;

/* ---------- Filtrado ---------- */
function filtrar(lista) {
  return lista.filter(s =>
    V.estados.has(s.estado) &&
    (!V.tecnico || s.tecnicos.some(t => t.id === V.tecnico)) &&
    (!V.cliente || s.clienteId === V.cliente) &&
    (!V.tipo || s.tipoId === V.tipo) &&
    (!V.soloUrgentes || s.prioridad === 'urgente'));
}
const delDia = iso => filtrar(SERVICIOS.filter(s => s.fecha === iso));

function rangoVista() {
  const d = new Date(V.ancla);
  if (V.vista === 'dia') return [new Date(d), new Date(d)];
  if (V.vista === 'semana') {
    const ini = new Date(d); ini.setDate(d.getDate() - ((d.getDay() + 6) % 7));  // lunes
    const fin = new Date(ini); fin.setDate(ini.getDate() + 6);
    return [ini, fin];
  }
  return [new Date(d.getFullYear(), d.getMonth(), 1), new Date(d.getFullYear(), d.getMonth() + 1, 0)];
}
function serviciosVista() {
  const [a, b] = rangoVista();
  return filtrar(SERVICIOS.filter(s => { const f = parseISO(s.fecha); return f >= a && f <= b; }));
}

/* ============================================================
   Encabezado
   ============================================================ */
function renderHead() {
  const hoy = isoToday();
  /* Los indicadores acompañan al rango visible del calendario. */
  const h = serviciosVista();
  const rotulo = V.vista === 'dia' ? 'del día' : V.vista === 'semana' ? 'de la semana' : 'del mes';
  const cnt = k => h.filter(s => s.estado === k).length;
  const facturable = h.filter(s => s.estado === 'cerrada').reduce((a, s) => a + s.montoUsd, 0);
  const enRiesgo = h.filter(s => !s.slaOk && s.estado !== 'cerrada').length;

  document.getElementById('head').innerHTML = pageHead({
    crumbs: [{ t: 'Operación' }, { t: 'Agenda' }],
    icon: 'agenda',
    titulo: 'Agenda de servicios',
    meta: 'Tenant <b>' + (TENANTS.find(t => t.id === store.tenant) || TENANTS[0]).name + '</b> · ' +
      delDia(hoy).length + ' órdenes hoy · ' + SERVICIOS.length + ' en el período cargado · actualizado hace 12 s',
    acciones:
      '<button class="btn" id="btnHoy">' + icon('clock', 'ic-sm') + 'Hoy</button>' +
      '<button class="btn" id="btnExport">' + icon('export', 'ic-sm') + 'Exportar</button>' +
      '<button class="btn" id="btnImprimir">' + icon('print', 'ic-sm') + 'Imprimir hoja de ruta</button>' +
      '<a class="btn btn-primary" href="servicio-nuevo.html">' + icon('plus', 'ic-sm') + 'Nuevo servicio</a>',
    kpis:
      kpi('Servicios ' + rotulo, h.length, tituloRango()) +
      kpi('Asignadas', cnt('asignada'), 'sin salir del taller', '<span class="kpi-dot" style="background:var(--st-asignada)"></span>') +
      kpi('En camino', cnt('camino'), 'GPS activo', '<span class="kpi-dot" style="background:var(--st-camino)"></span>') +
      kpi('Trabajando', cnt('trabajando'), 'check-in hecho', '<span class="kpi-dot" style="background:var(--st-trabajando)"></span>') +
      kpi('Con pendientes', cnt('pendiente'), 'requieren revisión', '<span class="kpi-dot" style="background:var(--st-pendiente)"></span>') +
      kpi('Cerradas', cnt('cerrada'), 'conformadas', '<span class="kpi-dot" style="background:var(--st-cerrada)"></span>') +
      kpi('SLA en riesgo', '<span style="color:var(--err)">' + enRiesgo + '</span>', 'fuera de plazo pactado') +
      kpi('Facturable ' + rotulo, money(facturable, 'lg left'), 'solo órdenes cerradas'),
  });

  document.getElementById('btnHoy').onclick = () => { V.ancla = new Date(); V.ancla.setHours(0,0,0,0); render(); };
  document.getElementById('btnExport').onclick = () => {
    toastOk('Exportación generada', 'Se preparó “agenda-' + hoy + '.xlsx” con ' + serviciosVista().length + ' órdenes del rango visible.', { code: 'EXPORT_XLSX', accion: 'Descargar', onAccion: () => noMock('La descarga') });
  };
  document.getElementById('btnImprimir').onclick = () => {
    toastWarn('Impresión bloqueada', 'No se puede imprimir la hoja de ruta: 3 órdenes de hoy no tienen técnico asignado. Asignalas primero.', { code: 'ROUTE_INCOMPLETE_ASSIGNMENT', origen: 'Hoja de ruta', accion: 'Ver sin asignar', onAccion: () => document.getElementById('side').scrollIntoView({ behavior: 'smooth' }) });
  };
}

/* ============================================================
   Barra de filtros
   ============================================================ */
function renderFiltros() {
  const tecs = COLABORADORES.filter(c => c.activo);
  document.getElementById('filtros').innerHTML =
    '<div class="filters">' +
      '<div class="f-search">' + icon('search', 'ic-sm') + '<input id="fq" placeholder="Filtrar por orden, cliente o sucursal…"></div>' +
      '<span class="sep-v"></span>' +
      '<select class="inp" id="fTec" style="width:172px;height:30px"><option value="">Todos los técnicos</option>' +
        tecs.map(t => '<option value="' + t.id + '"' + (V.tecnico === t.id ? ' selected' : '') + '>' + esc(t.nombre) + '</option>').join('') + '</select>' +
      '<select class="inp" id="fCli" style="width:196px;height:30px"><option value="">Todos los clientes</option>' +
        CLIENTES.slice(0, 30).map(c => '<option value="' + c.id + '"' + (V.cliente === c.id ? ' selected' : '') + '>' + esc(c.nombre) + '</option>').join('') + '</select>' +
      '<select class="inp" id="fTipo" style="width:196px;height:30px"><option value="">Todos los tipos</option>' +
        TIPOS_SERVICIO.filter(t => t.activo).map(t => '<option value="' + t.id + '"' + (V.tipo === t.id ? ' selected' : '') + '>' + esc(t.nombre) + '</option>').join('') + '</select>' +
      '<span class="sep-v"></span>' +
      ESTADO_ORDER.map(k =>
        '<button class="chip' + (V.estados.has(k) ? ' on' : '') + '" data-est="' + k + '">' +
        '<span class="dot" style="background:' + ESTADOS[k].color + '"></span>' + ESTADOS[k].label + '</button>').join('') +
      '<button class="chip' + (V.soloUrgentes ? ' on' : '') + '" id="fUrg">⚡ Solo urgentes</button>' +
      '<span class="spacer"></span>' +
      '<button class="btn btn-sm btn-ghost" id="fReset">' + icon('refresh', 'ic-sm') + 'Limpiar</button>' +
    '</div>';

  document.querySelectorAll('[data-est]').forEach(b => b.onclick = () => {
    const k = b.dataset.est;
    if (V.estados.has(k)) V.estados.delete(k); else V.estados.add(k);
    if (!V.estados.size) {
      V.estados = new Set(ESTADO_ORDER);
      toastWarn('Filtro descartado', 'No se puede ocultar todos los estados a la vez: la agenda quedaría vacía. Se restauraron los 5 estados.', { code: 'FILTER_EMPTY_STATE' });
    }
    render();
  });
  document.getElementById('fUrg').onclick = () => { V.soloUrgentes = !V.soloUrgentes; render(); };
  document.getElementById('fTec').onchange = e => { V.tecnico = e.target.value; render(); };
  document.getElementById('fCli').onchange = e => { V.cliente = e.target.value; render(); };
  document.getElementById('fTipo').onchange = e => { V.tipo = e.target.value; render(); };
  document.getElementById('fReset').onclick = () => {
    V.estados = new Set(ESTADO_ORDER); V.tecnico = V.cliente = V.tipo = ''; V.soloUrgentes = false;
    render(); toastInfo('Filtros limpiados', 'Se muestran las 5 categorías de estado y todos los técnicos.', { code: 'FILTER_RESET' });
  };
  document.getElementById('fq').onkeydown = e => {
    if (e.key === 'Enter' && !e.target.value.trim()) toastWarn('Filtro vacío', 'Escribí un texto para filtrar la agenda.', { code: 'FILTER_EMPTY' });
  };
}

/* ============================================================
   Toolbar del calendario
   ============================================================ */
function tituloRango() {
  const [a, b] = rangoVista();
  if (V.vista === 'dia') return fechaLarga(a);
  if (V.vista === 'semana') {
    const mismoMes = a.getMonth() === b.getMonth();
    return a.getDate() + (mismoMes ? '' : ' de ' + MES[a.getMonth()]) + ' – ' + b.getDate() + ' de ' + MES[b.getMonth()] + ' de ' + b.getFullYear();
  }
  return MES[a.getMonth()] + ' de ' + a.getFullYear();
}
function renderToolbar() {
  const n = serviciosVista().length;
  document.getElementById('calToolbar').innerHTML =
    '<div class="btn-group">' +
      '<button class="btn btn-ico" id="prev">' + icon('chevL', 'ic-sm') + '</button>' +
      '<button class="btn btn-ico" id="next">' + icon('chevR', 'ic-sm') + '</button>' +
    '</div>' +
    '<span class="cal-date">' + tituloRango() + '</span>' +
    '<span class="pill pill-info">' + n + ' órdenes</span>' +
    '<span class="spacer"></span>' +
    legendHTML() +
    '<span class="sep-v"></span>' +
    '<div class="seg">' +
      ['dia', 'semana', 'mes'].map(v =>
        '<button class="' + (V.vista === v ? 'on' : '') + '" data-v="' + v + '">' + (v === 'dia' ? 'Día' : v === 'semana' ? 'Semana' : 'Mes') + '</button>').join('') +
    '</div>';

  document.querySelectorAll('[data-v]').forEach(b => b.onclick = () => { V.vista = b.dataset.v; render(); });
  document.getElementById('prev').onclick = () => mover(-1);
  document.getElementById('next').onclick = () => mover(1);
}
function mover(dir) {
  const d = V.ancla;
  if (V.vista === 'dia') d.setDate(d.getDate() + dir);
  else if (V.vista === 'semana') d.setDate(d.getDate() + 7 * dir);
  else d.setMonth(d.getMonth() + dir);
  render();
}

/* ============================================================
   Vista SEMANA — columnas con eventos posicionados por hora
   ============================================================ */
function lanes(evs) {
  /* Reparte los eventos superpuestos en carriles, cluster por cluster:
     el ancho se divide solo entre los que realmente se pisan. */
  const sorted = evs.slice().sort((a, b) => (a.hIni * 60 + a.mIni) - (b.hIni * 60 + b.mIni));
  let cluster = [], clusterEnd = -1;
  const cerrar = () => {
    const n = Math.max(1, ...cluster.map(e => e._lane + 1));
    cluster.forEach(e => e._lanes = n);
    cluster = [];
  };
  const fin = [];
  sorted.forEach(e => {
    const ini = e.hIni * 60 + e.mIni, end = ini + e.dur;
    if (ini >= clusterEnd && cluster.length) { cerrar(); fin.length = 0; }
    let l = 0;
    while (fin[l] != null && fin[l] > ini) l++;
    fin[l] = end; e._lane = l;
    clusterEnd = Math.max(clusterEnd, end);
    cluster.push(e);
  });
  if (cluster.length) cerrar();
  return sorted;
}

function renderSemana() {
  const [ini] = rangoVista();
  const hoy = isoToday();
  const dias = [];
  for (let i = 0; i < 7; i++) { const d = new Date(ini); d.setDate(ini.getDate() + i); dias.push(d); }

  let html = '<div class="cal-week">';
  html += '<div class="cal-hd corner"></div>';
  dias.forEach(d => {
    const iso = fmtISO(d), n = delDia(iso).length, es = iso === hoy;
    html += '<div class="cal-hd' + (es ? ' today' : '') + '">' +
      '<div class="dow">' + DOW_S[d.getDay()] + '</div>' +
      '<div class="dnum">' + d.getDate() + '</div>' +
      '<div class="dcount">' + (n ? n + ' órdenes' : 'sin agenda') + '</div></div>';
  });

  html += '<div class="cal-hours">';
  for (let h = H_INI; h < H_FIN; h++) html += '<div class="h">' + pad(h) + ':00</div>';
  html += '</div>';

  const ahora = new Date();
  const ALTO = (H_FIN - H_INI) * PX_H;
  const MAX_LANES = 3;                       /* más de 3 solapadas: se agrupan en “+N” */

  dias.forEach(d => {
    const iso = fmtISO(d), evs = lanes(delDia(iso)), es = iso === hoy;
    const visibles = evs.filter(e => e._lane < MAX_LANES);
    const ocultas = evs.length - visibles.length;

    html += '<div class="cal-col' + (d.getDay() === 0 ? ' off' : '') + (es ? ' today' : '') + '" style="height:' + ALTO + 'px">';
    if (es && ahora.getHours() >= H_INI && ahora.getHours() < H_FIN) {
      html += '<div class="cal-now" style="top:' + ((ahora.getHours() + ahora.getMinutes() / 60 - H_INI) * PX_H) + 'px"></div>';
    }
    visibles.forEach(e => {
      const carriles = Math.min(MAX_LANES, e._lanes);
      const top = Math.max(0, (e.hIni + e.mIni / 60 - H_INI) * PX_H);
      const hgt = Math.max(20, Math.min((e.dur / 60) * PX_H - 2, ALTO - top - 2));
      const w = 100 / carriles;
      const angosto = carriles > 1;
      html += '<div class="ev ev-abs ev-' + e.estado + '" data-id="' + e.id + '" ' +
        'title="' + esc(e.id + ' · ' + hhmm(e.hIni, e.mIni) + ' · ' + e.cliente + ' — ' + e.sucursal + ' · ' + e.tipo) + '" ' +
        'style="top:' + top + 'px;height:' + hgt + 'px;left:calc(' + (e._lane * w) + '% + 2px);width:calc(' + w + '% - 4px)">' +
        '<div class="ev-t">' + (angosto ? '' : hhmm(e.hIni, e.mIni) + ' ') + esc(e.cliente.split(' ')[0]) + (e.prioridad === 'urgente' ? ' ⚡' : '') + '</div>' +
        (hgt > 28 ? '<div class="ev-s">' + (angosto ? hhmm(e.hIni, e.mIni) + ' · ' : '') + esc(e.sucursal) + '</div>' : '') +
        (hgt > 52 && !angosto ? '<div class="ev-s">' + esc(e.tipo) + '</div>' : '') +
        (hgt > 76 && !angosto ? '<div class="ev-s">' + e.tecnicos.map(t => esc(t.nombre.split(' ')[0])).join(', ') + '</div>' : '') +
        '</div>';
    });
    if (ocultas) {
      html += '<div class="cal-overflow" data-dia="' + iso + '" title="Ver el día completo">+' + ocultas + ' más</div>';
    }
    html += '</div>';
  });
  html += '</div>';
  return html;
}

/* ============================================================
   Vista DÍA — swimlanes por técnico (tablero de asignación)
   ============================================================ */
function renderDia() {
  const iso = fmtISO(V.ancla);
  const evs = delDia(iso);
  const conTrabajo = new Set(); evs.forEach(e => e.tecnicos.forEach(t => conTrabajo.add(t.id)));
  const tecs = COLABORADORES.filter(c => c.activo && (conTrabajo.has(c.id) || !V.tecnico)).slice(0, 18);
  const nH = H_FIN - H_INI;

  let html = '<div style="min-width:900px">';
  html += '<div class="res-hd"><div class="rh-l">Colaborador · ' + tecs.length + '</div><div class="rh-r" style="grid-template-columns:repeat(' + nH + ',1fr)">';
  for (let h = H_INI; h < H_FIN; h++) html += '<div class="rh-h">' + pad(h) + ':00</div>';
  html += '</div></div>';

  tecs.forEach(t => {
    const j = JORNADA_PLANTILLAS[t.jornada];
    const mios = evs.filter(e => e.tecnicos.some(x => x.id === t.id));
    const carga = mios.reduce((a, e) => a + e.dur, 0) / 60;
    const jIni = +j.ini.split(':')[0], jFin = +j.fin.split(':')[0];
    const trabajaHoy = j.dias.includes(V.ancla.getDay());

    html += '<div class="res-row">' +
      '<div class="res-name">' + avatar(t.nombre, 'av-sm') +
        '<div style="min-width:0"><div class="truncate" style="font-size:11.5px;font-weight:600">' + esc(t.nombre) + '</div>' +
        '<div class="xsmall muted truncate">' + esc(t.esp) + ' · ' + (trabajaHoy ? carga.toFixed(1).replace('.0','') + ' h asignadas' : 'franco') + '</div></div>' +
        '<span class="spacer"></span>' +
        (carga > 9 ? '<span class="pill pill-err" title="Sobreasignado">' + carga.toFixed(0) + 'h</span>' : '') +
      '</div>' +
      '<div class="res-lane"><div class="grid-lines"></div>';

    /* Fuera de jornada */
    if (!trabajaHoy) html += '<div class="off-band" style="left:0;right:0"></div>';
    else {
      if (jIni > H_INI) html += '<div class="off-band" style="left:0;width:' + ((jIni - H_INI) / nH * 100) + '%"></div>';
      if (jFin < H_FIN) html += '<div class="off-band" style="left:' + ((jFin - H_INI) / nH * 100) + '%;right:0"></div>';
      if (j.break) {
        const b0 = +j.break[0].split(':')[0], b1 = +j.break[1].split(':')[0];
        html += '<div class="off-band" style="left:' + ((b0 - H_INI) / nH * 100) + '%;width:' + ((b1 - b0) / nH * 100) + '%" title="Descanso"></div>';
      }
    }

    mios.forEach(e => {
      const left = (e.hIni + e.mIni / 60 - H_INI) / nH * 100;
      const w = (e.dur / 60) / nH * 100;
      html += '<div class="res-ev ev-' + e.estado + '" data-id="' + e.id + '" ' +
        'style="left:' + left + '%;width:calc(' + w + '% - 2px);border-left-color:' + ESTADOS[e.estado].color + ';background:' + ESTADOS[e.estado].bg + '" ' +
        'title="' + esc(e.id + ' · ' + e.cliente + ' · ' + e.sucursal) + '">' +
        '<span class="rt">' + hhmm(e.hIni, e.mIni) + '</span>' + esc(e.cliente.split(' ').slice(0, 2).join(' ')) +
        (e.prioridad === 'urgente' ? ' ⚡' : '') + '</div>';
    });
    html += '</div></div>';
  });
  html += '</div>';
  return html;
}

/* ============================================================
   Vista MES
   ============================================================ */
function renderMes() {
  const a = new Date(V.ancla.getFullYear(), V.ancla.getMonth(), 1);
  const ini = new Date(a); ini.setDate(a.getDate() - ((a.getDay() + 6) % 7));
  const hoy = isoToday();
  let html = '<div class="cal-month">';
  ['Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb', 'Dom'].forEach(d => html += '<div class="cal-mhd">' + d + '</div>');
  for (let i = 0; i < 42; i++) {
    const d = new Date(ini); d.setDate(ini.getDate() + i);
    const iso = fmtISO(d), evs = delDia(iso);
    const otro = d.getMonth() !== V.ancla.getMonth();
    html += '<div class="cal-mcell' + (otro ? ' other' : '') + (iso === hoy ? ' today' : '') + '">' +
      '<div class="cal-mnum">' + d.getDate() + (evs.length ? '<span class="cnt">' + evs.length + '</span>' : '') + '</div>' +
      evs.slice(0, 3).map(e =>
        '<div class="ev ev-' + e.estado + '" data-id="' + e.id + '" style="padding:1px 4px">' +
        '<div class="ev-t">' + hhmm(e.hIni, e.mIni) + ' ' + esc(e.cliente.split(' ')[0]) + '</div></div>').join('') +
      (evs.length > 3 ? '<div class="cal-more" data-dia="' + iso + '">+' + (evs.length - 3) + ' más</div>' : '') +
      '</div>';
    if (i >= 34 && d.getMonth() !== V.ancla.getMonth() && d.getDay() === 0) break;
  }
  html += '</div>';
  return html;
}

/* ============================================================
   Panel lateral: cola de despacho + alertas
   ============================================================ */
function renderSide() {
  const hoy = isoToday();
  const h = delDia(hoy);
  const urgentes = h.filter(s => s.prioridad === 'urgente' && s.estado !== 'cerrada').slice(0, 6);
  const pend = filtrar(SERVICIOS.filter(s => s.estado === 'pendiente')).slice(0, 5);
  const cargaCuadrillas = CUADRILLAS.map(c => ({
    ...c, n: SERVICIOS.filter(s => s.fecha === hoy && s.cuadrilla === c.nombre).length
  }));

  document.getElementById('side').innerHTML =
    '<div class="card">' +
      '<div class="card-head">' + icon('bolt') + '<h3>Cola de despacho</h3>' +
        '<span class="pill pill-err">' + urgentes.length + ' urgentes</span>' +
        '<div class="right"><button class="btn btn-sm" id="autoAsig">Auto-asignar</button></div></div>' +
      '<div class="card-body p0 dispatch-list">' +
        (urgentes.length ? urgentes.map(s =>
          '<div class="disp-item" data-id="' + s.id + '">' +
            '<span class="disp-bar" style="background:' + ESTADOS[s.estado].color + '"></span>' +
            '<div style="min-width:0;flex:1">' +
              '<div class="row" style="gap:5px"><span class="mono xsmall strong">' + s.id + '</span>' + pill(s.estado) + '</div>' +
              '<div class="truncate strong" style="font-size:12px">' + esc(s.cliente) + '</div>' +
              '<div class="xsmall muted truncate">' + esc(s.sucursal) + ' · ' + esc(s.ciudad) + '</div>' +
              '<div class="xsmall muted-2">' + hhmm(s.hIni, s.mIni) + ' · SLA ' + s.sla + ' h · ' + esc(s.tipo) + '</div>' +
            '</div>' +
            '<div style="text-align:right">' + (s.cuadrilla
              ? '<span class="pill pill-violet">Cuadrilla</span>'
              : avatar(s.tecnicos[0].nombre, 'av-sm')) + '</div>' +
          '</div>').join('')
          : '<div class="empty">' + icon('check') + '<h4>Sin urgencias abiertas</h4><div class="small">Toda la cola del día está despachada.</div></div>') +
      '</div>' +
    '</div>' +

    '<div class="card">' +
      '<div class="card-head">' + icon('alert') + '<h3>Cierres con pendientes</h3>' +
        '<span class="pill pill-warn">' + filtrar(SERVICIOS.filter(s => s.estado === 'pendiente')).length + '</span></div>' +
      '<div class="card-body p0">' +
        pend.map(s =>
          '<div class="disp-item" data-id="' + s.id + '">' +
            '<span class="disp-bar" style="background:var(--st-pendiente)"></span>' +
            '<div style="min-width:0">' +
              '<div class="row" style="gap:5px"><span class="mono xsmall strong">' + s.id + '</span>' +
              '<span class="xsmall muted">' + fechaCorta(parseISO(s.fecha)) + '</span></div>' +
              '<div class="truncate strong" style="font-size:12px">' + esc(s.cliente) + '</div>' +
              '<div class="xsmall" style="color:var(--warn)">' + esc(s.pendientes) + '</div>' +
              '<div class="xsmall muted-2">' + s.checklistOk + '/' + s.checklistTotal + ' del checklist</div>' +
            '</div></div>').join('') +
      '</div>' +
    '</div>' +

    '<div class="card">' +
      '<div class="card-head">' + icon('users') + '<h3>Carga por cuadrilla</h3>' +
        '<div class="right"><a class="small" href="colaboradores.html">Ver equipo</a></div></div>' +
      '<div class="card-body">' +
        cargaCuadrillas.map(c =>
          '<div class="mb8">' +
            '<div class="row" style="gap:6px;margin-bottom:3px">' +
              '<span class="strong small">' + esc(c.nombre) + '</span>' +
              (c.activa ? '<span class="tag">' + c.n + ' personas: ' + c.n + '</span>' : '<span class="pill pill-err">Inactiva</span>') +
              '<span class="spacer"></span><span class="xsmall muted">' + c.n + ' órdenes hoy</span></div>' +
            '<div class="bar"><span style="width:' + Math.min(100, c.n * 22) + '%;background:' + (c.n > 4 ? 'var(--st-asignada)' : 'var(--accent)') + '"></span></div>' +
            '<div class="xsmall muted-2">' + esc(c.jefe) + ' · ' + esc(c.zona) + '</div>' +
          '</div>').join('') +
      '</div>' +
    '</div>';

  document.getElementById('autoAsig').onclick = () => {
    toastWarn('Auto-asignación parcial', '4 de 6 órdenes se asignaron por cercanía y especialidad. 2 quedaron sin asignar: no hay técnico de Refrigeración disponible en el rango horario.', { code: 'AUTOASSIGN_PARTIAL', origen: 'Motor de despacho', sticky: true, accion: 'Ver las 2 órdenes', onAccion: () => noMock('El detalle de auto-asignación') });
  };
}

/* ============================================================
   Render
   ============================================================ */
function render() {
  renderHead();
  renderFiltros();
  renderToolbar();
  const cal = document.getElementById('cal');
  cal.innerHTML = V.vista === 'semana' ? renderSemana() : V.vista === 'dia' ? renderDia() : renderMes();
  renderSide();

  document.querySelectorAll('[data-id]').forEach(el => el.onclick = () => {
    const s = SERVICIOS.find(x => x.id === el.dataset.id);
    if (s) abrirServicio(s);
  });
  document.querySelectorAll('[data-dia]').forEach(el => el.onclick = e => {
    e.stopPropagation();
    V.ancla = parseISO(el.dataset.dia); V.vista = 'dia'; render();
  });
  repriceAll();

  /* Scroll a la franja horaria útil */
  if (V.vista === 'semana') cal.scrollTop = Math.max(0, (new Date().getHours() - H_INI - 2) * PX_H);
}
render();

/* Aviso una sola vez: contexto del mockup */
if (!sessionStorage.getItem('nt_hola')) {
  sessionStorage.setItem('nt_hola', '1');
  setTimeout(() => toastInfo('Agenda cargada', 'Mockup F0 con datos de ejemplo. Probá las vistas Día / Semana / Mes y hacé clic en cualquier orden.', { code: 'MOCKUP-F0', ms: 7000 }), 600);
}
</script>
</body>
</html>
