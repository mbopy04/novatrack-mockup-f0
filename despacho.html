<!DOCTYPE html>
<html lang="es-PY">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tablero de despacho · NovaTrack</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232E5BD8'/%3E%3Ctext x='16' y='23' font-family='Arial' font-size='19' font-weight='bold' fill='white' text-anchor='middle'%3EN%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/app.css">
<style>
  .board { display: grid; grid-template-columns: repeat(5, minmax(212px, 1fr)); gap: 10px; align-items: start; }
  .col-h { display: flex; align-items: center; gap: 7px; padding: 8px 10px; border-radius: var(--r-lg) var(--r-lg) 0 0;
           background: var(--surface); border: 1px solid var(--line); border-bottom: none; position: sticky; top: 0; z-index: 4; }
  .col-h .bar { height: 3px; border-radius: 2px; position: absolute; left: 10px; right: 10px; top: 0; }
  .col-b { background: var(--surface-2); border: 1px solid var(--line); border-radius: 0 0 var(--r-lg) var(--r-lg);
           padding: 7px; min-height: 220px; max-height: calc(100vh - 300px); overflow-y: auto; }
  .kcard { background: var(--surface); border: 1px solid var(--line); border-left: 3px solid; border-radius: var(--r);
           padding: 8px 9px; margin-bottom: 7px; box-shadow: var(--sh-1); cursor: pointer; transition: box-shadow .12s, transform .1s; }
  .kcard:hover { box-shadow: var(--sh-2); transform: translateY(-1px); }
  .kcard .k-top { display: flex; align-items: center; gap: 5px; margin-bottom: 3px; }
  .kcard .k-cli { font-size: 12px; font-weight: 700; line-height: 1.25; }
  .kcard .k-suc { font-size: 10.5px; color: var(--ink-3); }
  .kcard .k-foot { display: flex; align-items: center; gap: 5px; margin-top: 6px; padding-top: 6px; border-top: 1px solid var(--line-2); }
  @media (max-width: 1280px) { .board { grid-template-columns: repeat(2, minmax(0,1fr)); } }
  @media (max-width: 700px) { .board { grid-template-columns: minmax(0,1fr); } }
</style>
</head>
<body>
<div class="app">
  <div class="brand" id="brand"></div>
  <div class="topbar" id="topbar"></div>
  <nav class="nav" id="nav"></nav>
  <main class="main">
    <div id="head"></div>
    <div class="content tight">
      <div id="filtros"></div>
      <div class="board" id="board"></div>
    </div>
  </main>
</div>

<script src="assets/data.js"></script>
<script src="assets/app.js"></script>
<script>
boot('despacho');

const hoy = isoToday();
const D = { dia: hoy, tecnico: '', prioridad: '' };

function delDia() {
  return SERVICIOS.filter(s => s.fecha === D.dia &&
    (!D.tecnico || s.tecnicos.some(t => t.id === D.tecnico)) &&
    (!D.prioridad || s.prioridad === D.prioridad));
}

function renderHead() {
  const l = delDia();
  const abiertas = l.filter(s => s.estado !== 'cerrada');
  const facturado = l.filter(s => s.estado === 'cerrada').reduce((a, s) => a + s.montoUsd, 0);
  document.getElementById('head').innerHTML = pageHead({
    crumbs: [{ t: 'Operación' }, { t: 'Tablero de despacho' }],
    icon: 'despacho',
    titulo: 'Tablero de despacho',
    meta: 'Vista operativa del día · las tarjetas avanzan solas con los eventos que reporta la app del técnico',
    acciones:
      '<input class="inp" type="date" id="fDia" value="' + D.dia + '" style="width:158px">' +
      '<button class="btn" id="bRefresh">' + icon('refresh', 'ic-sm') + 'Actualizar</button>' +
      '<a class="btn" href="agenda.html">' + icon('agenda', 'ic-sm') + 'Ver agenda</a>' +
      '<a class="btn btn-primary" href="servicio-nuevo.html">' + icon('plus', 'ic-sm') + 'Nuevo servicio</a>',
    kpis:
      kpi('Órdenes del día', l.length, abiertas.length + ' abiertas') +
      ESTADO_ORDER.map(k => kpi(ESTADOS[k].label, l.filter(s => s.estado === k).length, '',
        '<span class="kpi-dot" style="background:' + ESTADOS[k].color + '"></span>')).join('') +
      kpi('Facturable cerrado', money(facturado, 'lg left'), 'del día'),
  });
  document.getElementById('fDia').onchange = e => { D.dia = e.target.value; render(); };
  document.getElementById('bRefresh').onclick = () => {
    render();
    toastOk('Tablero actualizado', delDia().length + ' órdenes sincronizadas con los eventos de la app.', { code: 'BOARD_REFRESHED' });
  };
}

function renderFiltros() {
  document.getElementById('filtros').innerHTML =
    '<div class="filters">' +
      '<span class="lbl mb0">Día</span><span class="strong">' + fechaLarga(parseISO(D.dia)) + '</span>' +
      '<span class="sep-v"></span>' +
      '<select class="inp" id="fTec" style="width:190px;height:30px"><option value="">Todos los colaboradores</option>' +
        COLABORADORES.filter(c => c.activo).map(c => '<option value="' + c.id + '"' + (D.tecnico === c.id ? ' selected' : '') + '>' + esc(c.nombre) + '</option>').join('') + '</select>' +
      '<button class="chip' + (D.prioridad === 'urgente' ? ' on' : '') + '" id="cUrg">⚡ Solo urgentes</button>' +
      '<span class="spacer"></span>' + legendHTML() +
    '</div>';
  document.getElementById('fTec').onchange = e => { D.tecnico = e.target.value; render(); };
  document.getElementById('cUrg').onclick = () => { D.prioridad = D.prioridad ? '' : 'urgente'; render(); };
}

function kcard(s) {
  return '<div class="kcard" data-id="' + s.id + '" style="border-left-color:' + ESTADOS[s.estado].color + '">' +
    '<div class="k-top"><span class="mono xsmall strong">' + s.id + '</span>' +
      (s.prioridad === 'urgente' ? '<span class="pill pill-err">⚡</span>' : '') +
      '<span class="spacer"></span><span class="xsmall muted">' + hhmm(s.hIni, s.mIni) + '</span></div>' +
    '<div class="k-cli truncate">' + esc(s.cliente) + '</div>' +
    '<div class="k-suc truncate">' + esc(s.sucursal) + ' · ' + esc(s.ciudad) + '</div>' +
    '<div class="k-suc truncate mt4">' + esc(s.tipo) + '</div>' +
    (s.estado === 'pendiente' ? '<div class="xsmall mt4" style="color:var(--warn)">⚠ ' + esc(s.pendientes) + '</div>' : '') +
    '<div class="k-foot">' +
      (s.cuadrilla
        ? '<span class="av-stack">' + s.tecnicos.slice(0, 3).map(t => avatar(t.nombre, 'av-sm')).join('') + '</span>'
        : avatar(s.tecnicos[0].nombre, 'av-sm')) +
      '<span class="xsmall muted truncate">' + (s.cuadrilla || s.tecnicos[0].nombre.split(' ')[0]) + '</span>' +
      '<span class="spacer"></span>' +
      (s.checklistTotal ? '<span class="xsmall muted">' + s.checklistOk + '/' + s.checklistTotal + '</span>' : '') +
      (s.slaOk ? '' : '<span class="pill pill-err">SLA</span>') +
    '</div></div>';
}

function render() {
  renderHead();
  renderFiltros();
  const l = delDia();
  document.getElementById('board').innerHTML = ESTADO_ORDER.map(k => {
    const col = l.filter(s => s.estado === k);
    const usdCol = col.reduce((a, s) => a + s.montoUsd, 0);
    return '<div>' +
      '<div class="col-h" style="position:relative"><span class="bar" style="background:' + ESTADOS[k].color + '"></span>' +
        '<span class="strong" style="font-size:12.5px">' + ESTADOS[k].label + '</span>' +
        '<span class="pill pill-neutral">' + col.length + '</span>' +
        '<span class="spacer"></span>' +
        '<span class="xsmall muted">' + usd(usdCol) + '</span>' +
      '</div>' +
      '<div class="col-b">' +
        (col.length ? col.map(kcard).join('')
          : '<div class="empty" style="padding:22px 8px"><div class="small muted">Sin órdenes en este estado</div></div>') +
      '</div></div>';
  }).join('');

  document.querySelectorAll('[data-id]').forEach(el => el.onclick = () => abrirServicio(SERVICIOS.find(s => s.id === el.dataset.id)));
  repriceAll();
}
render();

if (!delDia().length) {
  toastWarn('Día sin agenda', 'No hay órdenes cargadas para ' + fechaLarga(parseISO(D.dia)) + '. Elegí otra fecha o creá un servicio.',
    { code: 'BOARD_EMPTY_DAY', origen: 'Tablero de despacho' });
}
</script>
</body>
</html>
