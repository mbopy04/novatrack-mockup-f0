<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>App técnico · Login</title>
<link rel="stylesheet" href="../assets/css/novatrack.css">
<link rel="stylesheet" href="../assets/css/app.css">
</head>
<body class="appmock">
<div data-screen>
  <div class="ascreen" style="background:linear-gradient(170deg,#1B2A6B 0%,#16225a 58%,#2a1f4d 100%)">
    <div class="apad" style="padding:30px 22px;min-height:100%;display:flex;flex-direction:column;color:#fff">

      <div style="text-align:center;margin-top:22px">
        <div style="width:62px;height:62px;border-radius:16px;margin:0 auto 13px;
             background:linear-gradient(135deg,var(--accent),var(--violet));display:grid;place-items:center;
             font-size:28px;font-weight:800;box-shadow:0 8px 24px rgba(0,0,0,.35)">N</div>
        <div style="font-size:23px;font-weight:700;letter-spacing:-.03em">NovaTrack</div>
        <div style="font-size:12px;opacity:.6;margin-top:2px">App de campo · by Noventra</div>
      </div>

      <div style="margin-top:34px">
        <div class="afield">
          <label class="afield__l" style="color:rgba(255,255,255,.8)">Usuario o CI</label>
          <input class="ainput" id="user" value="3.998.120" inputmode="numeric"
                 style="background:rgba(255,255,255,.11);border-color:rgba(255,255,255,.22);color:#fff">
        </div>
        <div class="afield">
          <label class="afield__l" style="color:rgba(255,255,255,.8)">Contraseña</label>
          <input class="ainput" id="pass" type="password" value="··········"
                 style="background:rgba(255,255,255,.11);border-color:rgba(255,255,255,.22);color:#fff">
        </div>
        <button class="abtn abtn--primary" id="entrar" style="margin-top:6px">Ingresar</button>
        <button class="abtn abtn--sm" id="offline-login"
                style="margin-top:9px;background:transparent;border-color:rgba(255,255,255,.26);color:#fff">
          Ingresar sin conexión
        </button>
      </div>

      <div class="abanner abanner--info" style="margin-top:20px;background:rgba(46,91,216,.16);border-color:rgba(123,163,240,.3);color:rgba(255,255,255,.86)">
        <span style="flex:0 0 16px" id="bi"></span>
        <div><strong>Primer ingreso en este teléfono</strong>
          Vas a tener que leer y firmar el consentimiento de registro de ubicación antes de recibir servicios.</div>
      </div>

      <div style="margin-top:auto;padding-top:26px;text-align:center;font-size:10.5px;opacity:.45;line-height:1.6">
        NovaTrack 0.1.0-mockup · Moto G84 · Android 14<br>
        Empresa: Frigorífico Guaraní S.A.
      </div>
    </div>
  </div>
</div>

<script src="../assets/js/novatrack.js"></script>
<script src="../assets/js/app.js"></script>
<script>
A.boot({ label: "1 · Login del técnico", bat: "47" });
document.getElementById("bi").innerHTML = NT.icon("info", 16);

document.getElementById("entrar").addEventListener("click", function () {
  if (!document.getElementById("user").value.trim()) {
    document.getElementById("user").classList.add("is-err");
    A.toast({ kind: "err", title: "Falta el usuario", msg: "Ingresá tu CI o tu usuario para continuar.",
      reason: "VALIDATION · campo=usuario · requerido" });
    return;
  }
  A.toast({ kind: "ok", title: "Bienvenido, Marcos", msg: "Verificando consentimiento de registro de ubicación…" });
  setTimeout(function () { location.href = "consentimiento.html"; }, 900);
});

document.getElementById("offline-login").addEventListener("click", function () {
  A.toast({ kind: "warn", title: "No se puede entrar sin conexión todavía", sticky: true,
    msg: "Este teléfono nunca inició sesión con NovaTrack, así que no hay credenciales guardadas para validar contra el dispositivo. Conectate una vez y después vas a poder entrar sin señal.",
    reason: "NO_CACHED_CREDENTIALS · dispositivo=nuevo · requiere_primer_login_online=true" });
});
</script>
</body>
</html>
