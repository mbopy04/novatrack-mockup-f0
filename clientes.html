<!DOCTYPE html>
<html lang="es-PY">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clientes · NovaTrack</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232E5BD8'/%3E%3Ctext x='16' y='23' font-family='Arial' font-size='19' font-weight='bold' fill='white' text-anchor='middle'%3EN%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/app.css">
</head>
<body>
<div class="app">
  <div class="brand" id="brand"></div>
  <div class="topbar" id="topbar"></div>
  <nav class="nav" id="nav"></nav>
  <main class="main">
    <div id="head"></div>
    <div class="content">
      <div id="filtros"></div>
      <div class="card">
        <div class="card-head">
          <h2>Maestro de clientes</h2>
          <span class="sub" id="sub"></span>
          <div class="right">
            <button class="btn btn-sm" id="btnCols">Columnas</button>
            <button class="btn btn-sm" id="btnMasivo">Acción masiva</button>
          </div>
        </div>
        <div class="tbl-wrap"><table class="tbl tbl-zebra" id="tabla"></table></div>
        <div id="pager"></div>
      </div>
    </div>
  </main>
</div>

<script src="assets/data.js"></script>
<script src="assets/app.js"></script>
<script>
boot('clientes');

const POR_PAGINA = 25;
const S = { page: 1, q: '', rubro: '', ciudad: '', estado: '', sinGeo: false, sort: 'nombre', dir: 1, sel: new Set() };

const RUBROS = [...new Set(CLIENTES.map(c => c.rubro))].sort();
const CIUDADES_N = [...new Set(CLIENTES.flatMap(c => c.sucursales.map(s => s.ciudad)))].sort();

function filtradas() {
  let l = CLIENTES.filter(c =>
    (!S.q || (c.nombre + c.ruc + c.contacto).toLowerCase().includes(S.q.toLowerCase())) &&
    (!S.rubro || c.rubro === S.rubro) &&
    (!S.estado || c.estado === S.estado) &&
    (!S.ciudad || c.sucursales.some(s => s.ciudad === S.ciudad)) &&
    (!S.sinGeo || c.sinGeo > 0));
  const k = S.sort;
  l.sort((a, b) => {
    const va = a[k], vb = b[k];
    return (typeof va === 'string' ? va.localeCompare(vb) : va - vb) * S.dir;
  });
  return l;
}

function renderHead() {
  const total = CLIENTES.length;
  const suc = CLIENTES.reduce((a, c) => a + c.nSuc, 0);
  const sinGeo = CLIENTES.reduce((a, c) => a + c.sinGeo, 0);
  const susp = CLIENTES.filter(c => c.estado !== 'activo').length;
  const saldo = CLIENTES.reduce((a, c) => a + Math.max(0, c.saldoUsd), 0);

  document.getElementById('head').innerHTML = pageHead({
    crumbs: [{ t: 'Maestros' }, { t: 'Clientes' }],
    icon: 'cliente',
    titulo: 'Clientes',
    meta: 'Cartera del tenant activo · última sincronización con facturación hace 6 min',
    acciones:
      '<button class="btn" id="btnImportar">' + icon('down', 'ic-sm') + 'Importar CSV</button>' +
      '<button class="btn" id="btnExportar">' + icon('export', 'ic-sm') + 'Exportar</button>' +
      '<button class="btn btn-primary" id="btnNuevo">' + icon('plus', 'ic-sm') + 'Nuevo cliente</button>',
    kpis:
      kpi('Clientes', total, susp + ' suspendidos') +
      kpi('Sucursales', nfInt.format(suc), 'promedio ' + (suc / total).toFixed(1) + ' por cliente') +
      kpi('Sin georreferenciar', '<span style="color:var(--warn)">' + sinGeo + '</span>', 'no validan geocerca') +
      kpi('Servicios / mes', nfInt.format(CLIENTES.reduce((a, c) => a + c.serviciosMes, 0)), 'sobre la cartera') +
      kpi('Saldo por cobrar', money(saldo, 'lg left'), 'facturado no cobrado') +
      kpi('SLA promedio', nf1.format(CLIENTES.reduce((a, c) => a + c.slaCumpl, 0) / total) + ' %', 'últimos 90 días'),
    tabs:
      '<a class="tab active" href="clientes.html">Todos <span class="pill-n">' + total + '</span></a>' +
      '<a class="tab" href="#" data-t="activos">Activos <span class="pill-n">' + (total - susp) + '</span></a>' +
      '<a class="tab" href="#" data-t="susp">Suspendidos <span class="pill-n">' + susp + '</span></a>' +
      '<a class="tab" href="#" data-t="geo">Con sucursales sin geo <span class="pill-n">' + CLIENTES.filter(c => c.sinGeo > 0).length + '</span></a>',
  });

  document.querySelectorAll('[data-t]').forEach(a => a.onclick = e => {
    e.preventDefault();
    document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
    a.classList.add('active');
    S.estado = a.dataset.t === 'activos' ? 'activo' : a.dataset.t === 'susp' ? 'suspendido' : '';
    S.sinGeo = a.dataset.t === 'geo';
    S.page = 1; render();
  });
  document.getElementById('btnNuevo').onclick = altaCliente;
  document.getElementById('btnImportar').onclick = () =>
    toastErr('Importación rechazada', 'El archivo “clientes-agosto.csv” tiene 12 filas sin RUC y 3 con coordenadas fuera de Paraguay. No se importó ninguna fila.',
      { code: 'IMPORT_VALIDATION_FAILED', origen: 'Importador CSV', sticky: true, accion: 'Descargar reporte de errores', onAccion: () => noMock('La descarga del reporte') });
  document.getElementById('btnExportar').onclick = () =>
    toastOk('Exportación lista', filtradas().length + ' clientes exportados a XLSX con sus sucursales y coordenadas.', { code: 'EXPORT_XLSX' });
}

function renderFiltros() {
  document.getElementById('filtros').innerHTML =
    '<div class="filters">' +
      '<div class="f-search">' + icon('search', 'ic-sm') + '<input id="q" value="' + esc(S.q) + '" placeholder="Buscar por nombre, RUC o contacto…"></div>' +
      '<select class="inp" id="fRubro" style="width:150px;height:30px"><option value="">Todos los rubros</option>' +
        RUBROS.map(r => '<option' + (S.rubro === r ? ' selected' : '') + '>' + r + '</option>').join('') + '</select>' +
      '<select class="inp" id="fCiudad" style="width:170px;height:30px"><option value="">Todas las ciudades</option>' +
        CIUDADES_N.map(r => '<option' + (S.ciudad === r ? ' selected' : '') + '>' + r + '</option>').join('') + '</select>' +
      '<span class="sep-v"></span>' +
      '<button class="chip' + (S.sinGeo ? ' on' : '') + '" id="cGeo">' + icon('pin', 'ic-sm') + 'Sin georreferenciar</button>' +
      '<button class="chip' + (S.estado === 'suspendido' ? ' on' : '') + '" id="cSusp">Suspendidos</button>' +
      '<span class="spacer"></span>' +
      '<span class="xsmall muted" id="selInfo"></span>' +
      '<button class="btn btn-sm btn-ghost" id="limpiar">' + icon('refresh', 'ic-sm') + 'Limpiar</button>' +
    '</div>';
  const q = document.getElementById('q');
  q.oninput = () => { S.q = q.value; S.page = 1; render(); q.focus(); };
  document.getElementById('fRubro').onchange = e => { S.rubro = e.target.value; S.page = 1; render(); };
  document.getElementById('fCiudad').onchange = e => { S.ciudad = e.target.value; S.page = 1; render(); };
  document.getElementById('cGeo').onclick = () => { S.sinGeo = !S.sinGeo; S.page = 1; render(); };
  document.getElementById('cSusp').onclick = () => { S.estado = S.estado === 'suspendido' ? '' : 'suspendido'; S.page = 1; render(); };
  document.getElementById('limpiar').onclick = () => { Object.assign(S, { q: '', rubro: '', ciudad: '', estado: '', sinGeo: false, page: 1 }); render(); };
}

const COLS = [
  { k: 'nombre', t: 'Cliente', w: '' },
  { k: 'rubro', t: 'Rubro' },
  { k: 'nSuc', t: 'Sucursales', c: 'num' },
  { k: 'contacto', t: 'Contacto principal' },
  { k: 'serviciosMes', t: 'Serv./mes', c: 'num' },
  { k: 'ticketProm', t: 'Ticket promedio', c: 'num' },
  { k: 'saldoUsd', t: 'Saldo', c: 'num' },
  { k: 'slaCumpl', t: 'SLA', c: 'num' },
  { k: 'estado', t: 'Estado', c: 'c' },
];

function render() {
  renderHead();
  renderFiltros();
  const l = filtradas();
  const totalPages = Math.max(1, Math.ceil(l.length / POR_PAGINA));
  if (S.page > totalPages) S.page = totalPages;
  const rows = l.slice((S.page - 1) * POR_PAGINA, S.page * POR_PAGINA);

  document.getElementById('sub').textContent = l.length + ' clientes · página ' + S.page + ' de ' + totalPages;
  document.getElementById('selInfo').textContent = S.sel.size ? S.sel.size + ' seleccionados' : '';

  document.getElementById('tabla').innerHTML =
    '<thead><tr>' +
      '<th style="width:28px"><input type="checkbox" id="chkAll" style="accent-color:var(--accent)"></th>' +
      COLS.map(c => '<th class="sortable ' + (c.c || '') + (S.sort === c.k ? ' sorted' : '') + '" data-k="' + c.k + '">' +
        c.t + (S.sort === c.k ? icon(S.dir === 1 ? 'chevU' : 'chevD', 'ic-sm') : '') + '</th>').join('') +
      '<th style="width:96px"></th>' +
    '</tr></thead><tbody>' +
    (rows.length ? rows.map(c =>
      '<tr class="clickable' + (S.sel.has(c.id) ? ' sel' : '') + '" data-id="' + c.id + '">' +
        '<td><input type="checkbox" class="rowchk" data-id="' + c.id + '"' + (S.sel.has(c.id) ? ' checked' : '') + ' style="accent-color:var(--accent)"></td>' +
        '<td><div class="who">' + avatar(c.nombre, 'av-sm') +
          '<div class="cell-2" style="min-width:0"><div class="cell-strong truncate">' + esc(c.nombre) + '</div>' +
          '<div class="cell-sub">RUC ' + c.ruc + ' · cliente desde ' + c.desde + '</div></div></div></td>' +
        '<td><span class="tag">' + c.rubro + '</span></td>' +
        '<td class="num"><span class="strong">' + c.nSuc + '</span>' +
          (c.sinGeo ? ' <span class="pill pill-warn" title="Sucursales sin coordenadas">' + c.sinGeo + ' sin geo</span>' : '') + '</td>' +
        '<td class="cell-2"><div class="truncate">' + esc(c.contacto) + '</div><div class="cell-sub">' + esc(c.tel) + '</div></td>' +
        '<td class="num">' + c.serviciosMes + '</td>' +
        '<td class="num">' + money(c.ticketProm) + '</td>' +
        '<td class="num">' + (c.saldoUsd > 0
            ? money(c.saldoUsd)
            : '<span class="muted">' + usd(0) + '</span>') + '</td>' +
        '<td class="num"><div class="row" style="justify-content:flex-end;gap:5px">' +
          '<span class="strong" style="color:' + (c.slaCumpl >= 95 ? 'var(--ok)' : c.slaCumpl >= 85 ? 'var(--warn)' : 'var(--err)') + '">' + c.slaCumpl + '%</span>' +
          '<span class="bar" style="width:38px"><span style="width:' + c.slaCumpl + '%;background:' + (c.slaCumpl >= 95 ? 'var(--ok)' : c.slaCumpl >= 85 ? 'var(--warn)' : 'var(--err)') + '"></span></span></div></td>' +
        '<td class="c">' + (c.estado === 'activo'
            ? '<span class="pill pill-ok">Activo</span>'
            : '<span class="pill pill-err" title="' + esc(c.motivoSuspension) + '">Suspendido</span>') + '</td>' +
        '<td><div class="row-act">' +
          '<a class="btn btn-sm btn-ico" href="cliente.html?id=' + c.id + '" title="Abrir ficha">' + icon('eye', 'ic-sm') + '</a>' +
          '<button class="btn btn-sm btn-ico" data-act="nuevo" data-id="' + c.id + '" title="Nuevo servicio">' + icon('plus', 'ic-sm') + '</button>' +
          '<button class="btn btn-sm btn-ico" data-act="mapa" data-id="' + c.id + '" title="Ver sucursales en el mapa">' + icon('pin', 'ic-sm') + '</button>' +
        '</div></td>' +
      '</tr>').join('')
      : '<tr><td colspan="11"><div class="empty">' + icon('search') + '<h4>Sin resultados</h4>' +
        '<div class="small">Ningún cliente coincide con los filtros aplicados.</div></div></td></tr>') +
    '</tbody>';

  document.getElementById('pager').innerHTML = pagerHTML(S.page, totalPages, l.length, POR_PAGINA);
  document.querySelectorAll('#pager [data-pg]').forEach(b => b.onclick = () => {
    if (b.disabled) return;
    S.page = +b.dataset.pg; render();
    document.querySelector('.main').scrollTo({ top: 0, behavior: 'smooth' });
  });
  document.querySelectorAll('th[data-k]').forEach(th => th.onclick = () => {
    if (S.sort === th.dataset.k) S.dir *= -1; else { S.sort = th.dataset.k; S.dir = 1; }
    render();
  });
  document.querySelectorAll('tr[data-id]').forEach(tr => tr.onclick = e => {
    if (e.target.closest('.row-act') || e.target.closest('input')) return;
    location.href = 'cliente.html?id=' + tr.dataset.id;
  });
  document.querySelectorAll('.rowchk').forEach(ch => ch.onclick = e => {
    e.stopPropagation();
    if (ch.checked) S.sel.add(ch.dataset.id); else S.sel.delete(ch.dataset.id);
    document.getElementById('selInfo').textContent = S.sel.size ? S.sel.size + ' seleccionados' : '';
    ch.closest('tr').classList.toggle('sel', ch.checked);
  });
  document.getElementById('chkAll').onclick = e => {
    rows.forEach(c => e.target.checked ? S.sel.add(c.id) : S.sel.delete(c.id));
    render();
  };
  document.querySelectorAll('[data-act]').forEach(b => b.onclick = e => {
    e.stopPropagation();
    const c = CLIENTES.find(x => x.id === b.dataset.id);
    if (b.dataset.act === 'nuevo') {
      if (c.estado !== 'activo') {
        toastErr('No se puede crear el servicio', c.nombre + ' está suspendido. ' + c.motivoSuspension,
          { code: 'CUSTOMER_BLOCKED_AR', origen: 'Maestro de clientes', accion: 'Ver estado de cuenta', onAccion: () => noMock('El estado de cuenta') });
        return;
      }
      location.href = 'servicio-nuevo.html';
    } else {
      if (c.sinGeo === c.nSuc) {
        toastWarn('Sin ubicaciones para mostrar', c.nombre + ' no tiene ninguna sucursal georreferenciada. Cargá coordenadas desde la ficha del cliente.',
          { code: 'NO_GEOCODED_BRANCHES', origen: 'Mapa' });
        return;
      }
      location.href = 'mapa.html';
    }
  });
  repriceAll();
}

function altaCliente() {
  modal({
    titulo: 'Nuevo cliente', icon: 'cliente', size: 'wide',
    body:
      '<div class="grid g-2">' +
        '<div class="field"><label class="lbl">Razón social <span class="req">*</span></label><input class="inp" id="nName" placeholder="Ej.: Distribuidora del Sur S.A."></div>' +
        '<div class="field"><label class="lbl">RUC <span class="req">*</span></label><input class="inp" id="nRuc" placeholder="80012345-6"></div>' +
      '</div>' +
      '<div class="grid g-3">' +
        '<div class="field"><label class="lbl">Rubro</label><select class="inp">' + RUBROS.map(r => '<option>' + r + '</option>').join('') + '</select></div>' +
        '<div class="field"><label class="lbl">Condición de pago</label><select class="inp"><option>Contado</option><option>15 días</option><option selected>30 días</option><option>45 días</option><option>60 días</option></select></div>' +
        '<div class="field"><label class="lbl">Moneda de facturación</label><select class="inp"><option>Guaraníes (PYG)</option><option>Dólares (USD)</option></select></div>' +
      '</div>' +
      '<div class="grid g-2">' +
        '<div class="field"><label class="lbl">Contacto principal</label><input class="inp" placeholder="Nombre y apellido"></div>' +
        '<div class="field"><label class="lbl">Teléfono</label><input class="inp" placeholder="+595 …"></div>' +
      '</div>' +
      '<div class="note note-neutral">' + icon('info') + '<div>Las sucursales y sus coordenadas se cargan después, desde la ficha del cliente. Un cliente sin sucursales no puede recibir servicios.</div></div>',
    onOk: bd => {
      const n = bd.querySelector('#nName').value.trim();
      const r = bd.querySelector('#nRuc').value.trim();
      if (!n || !r) {
        toastErr('Faltan datos obligatorios', 'Razón social y RUC son obligatorios para dar de alta un cliente.', { code: 'CUSTOMER_REQUIRED_FIELDS', origen: 'Alta de cliente' });
        return false;
      }
      if (!/^\d{6,8}-\d$/.test(r)) {
        toastErr('RUC inválido', 'El RUC “' + r + '” no cumple el formato paraguayo (6 a 8 dígitos, guion y dígito verificador).', { code: 'CUSTOMER_RUC_FORMAT', origen: 'Alta de cliente' });
        return false;
      }
      toastOk('Cliente creado', n + ' quedó registrado. Cargá al menos una sucursal para poder agendarle servicios.',
        { code: 'CUSTOMER_CREATED', accion: 'Agregar sucursal', onAccion: () => noMock('El alta de sucursal') });
    },
  });
}

document.getElementById('btnCols') && (document.getElementById('btnCols').onclick = () => noMock('El selector de columnas'));
render();
document.getElementById('btnMasivo').onclick = () => {
  if (!S.sel.size) {
    toastWarn('Nada seleccionado', 'Marcá al menos un cliente para aplicar una acción masiva.', { code: 'BULK_NO_SELECTION' });
    return;
  }
  toastInfo('Acción masiva', S.sel.size + ' clientes seleccionados. Las acciones masivas (cambio de ejecutivo, condición de pago, exportación) se implementan en F1.', { code: 'MOCKUP-F0' });
};
</script>
</body>
</html>
