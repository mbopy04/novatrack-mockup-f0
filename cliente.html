<!DOCTYPE html>
<html lang="es-PY">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ficha de cliente · NovaTrack</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232E5BD8'/%3E%3Ctext x='16' y='23' font-family='Arial' font-size='19' font-weight='bold' fill='white' text-anchor='middle'%3EN%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/app.css">
</head>
<body>
<div class="app">
  <div class="brand" id="brand"></div>
  <div class="topbar" id="topbar"></div>
  <nav class="nav" id="nav"></nav>
  <main class="main">
    <div id="head"></div>
    <div class="content"><div id="cuerpo"></div></div>
  </main>
</div>

<script src="assets/data.js"></script>
<script src="assets/app.js"></script>
<script>
boot('clientes');

const params = new URLSearchParams(location.search);
/* Sin ?id se abre el cliente activo con más sucursales: es el caso que hay que revisar
   (paginación de sucursales, distribución geográfica, faltantes de coordenadas). */
const porDefecto = CLIENTES.filter(c => c.estado === 'activo')
  .slice().sort((a, b) => b.nSuc - a.nSuc)[0];
const C = CLIENTES.find(c => c.id === params.get('id')) || porDefecto;
const SRV = SERVICIOS.filter(s => s.clienteId === C.id);
let tab = 'sucursales';
let sucPage = 1;
const SUC_POR_PAGINA = 25;

/* ---------- Encabezado ---------- */
function renderHead() {
  const cerradas = SRV.filter(s => s.estado === 'cerrada');
  const facturado = cerradas.reduce((a, s) => a + s.montoUsd + s.gastosUsd, 0);
  document.getElementById('head').innerHTML = pageHead({
    crumbs: [{ t: 'Maestros' }, { t: 'Clientes', href: 'clientes.html' }, { t: C.nombre }],
    icon: 'cliente',
    titulo: C.nombre,
    meta: 'RUC <b>' + C.ruc + '</b> · ' + C.rubro + ' · cliente desde ' + C.desde + ' · ejecutivo ' + C.ejecutivo +
      (C.estado === 'activo' ? ' · <span class="pill pill-ok">Activo</span>' : ' · <span class="pill pill-err">Suspendido</span>'),
    acciones:
      '<button class="btn" id="bMapa">' + icon('map', 'ic-sm') + 'Ver en el mapa</button>' +
      '<button class="btn" id="bEditar">' + icon('edit', 'ic-sm') + 'Editar</button>' +
      '<button class="btn btn-primary" id="bServicio">' + icon('plus', 'ic-sm') + 'Nuevo servicio</button>',
    kpis:
      kpi('Sucursales', C.nSuc, C.sinGeo ? C.sinGeo + ' sin coordenadas' : 'todas georreferenciadas') +
      kpi('Equipos', nfInt.format(C.sucursales.reduce((a, s) => a + s.equipos, 0)), 'bajo contrato') +
      kpi('Órdenes', SRV.length, cerradas.length + ' cerradas') +
      kpi('Ticket promedio', money(C.ticketProm, 'lg left'), 'últimos 12 meses') +
      kpi('Facturado', money(facturado, 'lg left'), 'período cargado') +
      kpi('Saldo', C.saldoUsd > 0 ? money(C.saldoUsd, 'lg left') : '<span class="muted">' + usd(0) + '</span>', C.condPago) +
      kpi('SLA', C.slaCumpl + ' %', 'cumplimiento 90 días'),
    tabs: ['sucursales|Sucursales|' + C.nSuc, 'servicios|Órdenes de servicio|' + SRV.length,
           'equipos|Equipos|' + C.sucursales.reduce((a, s) => a + s.equipos, 0), 'datos|Datos comerciales|',
           'facturacion|Facturación|'].map(t => {
      const [k, l, n] = t.split('|');
      return '<a class="tab' + (tab === k ? ' active' : '') + '" href="#" data-tab="' + k + '">' + l +
        (n ? ' <span class="pill-n">' + n + '</span>' : '') + '</a>';
    }).join(''),
  });

  document.querySelectorAll('[data-tab]').forEach(a => a.onclick = e => { e.preventDefault(); tab = a.dataset.tab; render(); });
  document.getElementById('bServicio').onclick = () => {
    if (C.estado !== 'activo') {
      toastErr('Cliente suspendido', C.nombre + ': ' + C.motivoSuspension, { code: 'CUSTOMER_BLOCKED_AR', origen: 'Ficha de cliente', sticky: true });
      return;
    }
    location.href = 'servicio-nuevo.html';
  };
  document.getElementById('bMapa').onclick = () => location.href = 'mapa.html';
  document.getElementById('bEditar').onclick = () => noMock('La edición del cliente');
}

/* ---------- Mini mapa de sucursales ---------- */
function miniMapa(sucs) {
  const geo = sucs.filter(s => s.geo);
  if (!geo.length) return '<div class="empty">' + icon('pin') + '<h4>Sin sucursales georreferenciadas</h4></div>';
  const lats = geo.map(s => s.lat), lngs = geo.map(s => s.lng);
  const minLat = Math.min(...lats), maxLat = Math.max(...lats);
  const minLng = Math.min(...lngs), maxLng = Math.max(...lngs);
  const W = 100, H = 100, pad = 8;
  const x = l => pad + (maxLng === minLng ? W / 2 : (l - minLng) / (maxLng - minLng) * (W - pad * 2));
  const y = l => pad + (maxLat === minLat ? H / 2 : (maxLat - l) / (maxLat - minLat) * (H - pad * 2));
  return '<svg viewBox="0 0 100 100" style="width:100%;height:230px;background:#EAEFF5;border-radius:5px">' +
    '<defs><pattern id="g" width="8" height="8" patternUnits="userSpaceOnUse">' +
    '<path d="M8 0H0v8" fill="none" stroke="#D8DFE9" stroke-width=".4"/></pattern></defs>' +
    '<rect width="100" height="100" fill="url(#g)"/>' +
    geo.map(s => '<g class="map-pin"><circle cx="' + x(s.lng).toFixed(1) + '" cy="' + y(s.lat).toFixed(1) + '" r="2.2" fill="#2E5BD8" stroke="#fff" stroke-width=".8"><title>' + esc(s.nombre) + '</title></circle></g>').join('') +
    '</svg>';
}

/* ---------- Pestañas ---------- */
function tabSucursales() {
  const total = C.sucursales.length;
  const totalPages = Math.max(1, Math.ceil(total / SUC_POR_PAGINA));
  if (sucPage > totalPages) sucPage = totalPages;
  const rows = C.sucursales.slice((sucPage - 1) * SUC_POR_PAGINA, sucPage * SUC_POR_PAGINA);
  return '<div class="grid g-main-side" style="align-items:start">' +
    '<div class="card">' +
      '<div class="card-head"><h2>Sucursales georreferenciadas</h2>' +
        '<span class="sub">' + total + ' sucursales · ' + C.sinGeo + ' sin coordenadas</span>' +
        '<div class="right"><button class="btn btn-sm" data-nomock="La exportación de sucursales">' + icon('export', 'ic-sm') + 'Exportar</button>' +
        '<button class="btn btn-sm btn-primary" id="bSuc">' + icon('plus', 'ic-sm') + 'Nueva sucursal</button></div></div>' +
      '<div class="tbl-wrap"><table class="tbl tbl-zebra"><thead><tr>' +
        '<th>Sucursal</th><th>Ciudad</th><th>Dirección</th><th class="num">Equipos</th>' +
        '<th>Contrato</th><th>Coordenadas</th><th>Contacto</th><th style="width:70px"></th>' +
      '</tr></thead><tbody>' +
      rows.map(s =>
        '<tr>' +
          '<td class="cell-strong">' + esc(s.nombre) + '</td>' +
          '<td>' + esc(s.ciudad) + '</td>' +
          '<td class="cell-sub" style="max-width:200px"><div class="truncate">' + esc(s.dir) + '</div></td>' +
          '<td class="num">' + s.equipos + '</td>' +
          '<td><span class="tag">' + esc(s.contrato) + '</span></td>' +
          '<td>' + (s.geo
            ? '<span class="cell-mono">' + s.lat.toFixed(4) + ', ' + s.lng.toFixed(4) + '</span>'
            : '<span class="pill pill-warn">Sin geo</span>') + '</td>' +
          '<td class="cell-2"><div class="truncate">' + esc(s.contacto) + '</div><div class="cell-sub">' + esc(s.tel) + '</div></td>' +
          '<td><div class="row-act">' +
            '<button class="btn btn-sm btn-ico" data-suc="' + s.id + '" title="Ver detalle">' + icon('eye', 'ic-sm') + '</button>' +
            '<button class="btn btn-sm btn-ico" data-geo="' + s.id + '" title="Ver en el mapa">' + icon('pin', 'ic-sm') + '</button>' +
          '</div></td>' +
        '</tr>').join('') +
      '</tbody></table></div>' +
      pagerHTML(sucPage, totalPages, total, SUC_POR_PAGINA) +
    '</div>' +
    '<div>' +
      '<div class="card"><div class="card-head">' + icon('map') + '<h3>Distribución geográfica</h3></div>' +
        '<div class="card-body">' + miniMapa(C.sucursales) +
        '<div class="hint mt8">' + C.sucursales.filter(s => s.geo).length + ' de ' + total + ' sucursales con coordenadas cargadas. ' +
        '<a href="mapa.html">Abrir mapa completo</a></div></div></div>' +
      '<div class="card"><div class="card-head">' + icon('building') + '<h3>Sucursales por ciudad</h3></div>' +
        '<div class="card-body">' +
        Object.entries(C.sucursales.reduce((a, s) => { a[s.ciudad] = (a[s.ciudad] || 0) + 1; return a; }, {}))
          .sort((a, b) => b[1] - a[1]).slice(0, 8).map(([c, n]) =>
            '<div class="row mb4"><span class="small" style="width:130px">' + esc(c) + '</span>' +
            '<span class="bar" style="flex:1"><span style="width:' + (n / total * 100 * 3) + '%;background:var(--accent)"></span></span>' +
            '<span class="xsmall muted" style="width:20px;text-align:right">' + n + '</span></div>').join('') +
        '</div></div>' +
    '</div></div>';
}

function tabServicios() {
  const l = SRV.slice(0, 25);
  return '<div class="card">' +
    '<div class="card-head"><h2>Órdenes de servicio</h2><span class="sub">' + SRV.length + ' órdenes en el período cargado</span>' +
      '<div class="right">' + legendHTML() + '</div></div>' +
    '<div class="tbl-wrap"><table class="tbl tbl-zebra"><thead><tr>' +
      '<th>Orden</th><th>Fecha</th><th>Sucursal</th><th>Tipo</th><th>Asignado a</th>' +
      '<th class="c">Checklist</th><th class="num">Mano de obra</th><th class="num">Gastos</th><th class="c">Estado</th>' +
    '</tr></thead><tbody>' +
    l.map(s =>
      '<tr class="clickable" data-os="' + s.id + '">' +
        '<td class="cell-mono strong">' + s.id + '</td>' +
        '<td class="nowrap">' + fechaCorta(parseISO(s.fecha)) + '<div class="cell-sub">' + hhmm(s.hIni, s.mIni) + '</div></td>' +
        '<td class="cell-2"><div class="truncate" style="max-width:170px">' + esc(s.sucursal) + '</div><div class="cell-sub">' + esc(s.ciudad) + '</div></td>' +
        '<td class="cell-2"><div class="truncate" style="max-width:180px">' + esc(s.tipo) + '</div>' +
          '<div class="cell-sub">' + prioTag(s.prioridad) + '</div></td>' +
        '<td>' + (s.cuadrilla
          ? '<div class="who"><span class="av-stack">' + s.tecnicos.slice(0, 3).map(t => avatar(t.nombre, 'av-sm')).join('') + '</span>' +
            '<span class="cell-sub">' + esc(s.cuadrilla) + '</span></div>'
          : '<div class="who">' + avatar(s.tecnicos[0].nombre, 'av-sm') + '<span class="truncate">' + esc(s.tecnicos[0].nombre) + '</span></div>') + '</td>' +
        '<td class="c"><span class="xsmall">' + s.checklistOk + '/' + s.checklistTotal + '</span>' +
          '<span class="bar" style="width:44px;margin:2px auto 0"><span style="width:' + (s.checklistOk / s.checklistTotal * 100) + '%;background:var(--ok)"></span></span></td>' +
        '<td class="num">' + money(s.montoUsd) + '</td>' +
        '<td class="num">' + (s.gastosUsd ? money(s.gastosUsd) : '<span class="muted">—</span>') + '</td>' +
        '<td class="c">' + pill(s.estado) + '</td>' +
      '</tr>').join('') +
    '</tbody></table></div>' +
    '<div class="card-foot">Mostrando las ' + l.length + ' órdenes más recientes. <a href="agenda.html">Ver en la agenda</a></div></div>';
}

function tabEquipos() {
  const r = mkRand(4242);
  const marcas = ['Carrier', 'Midea', 'Bosch', 'Danfoss', 'York', 'LG', 'Copeland', 'Trane'];
  const tipos = ['Split muro 12.000 BTU', 'Split piso-techo 36.000 BTU', 'Cámara frigorífica 24 m³', 'Chiller 60 TR',
    'Grupo electrógeno 100 kVA', 'Cortina de aire', 'Condensadora remota', 'Rack de refrigeración'];
  const eq = C.sucursales.slice(0, 12).flatMap((s, i) =>
    Array.from({ length: Math.min(3, s.equipos) }, (_, k) => ({
      id: 'EQ-' + (5000 + i * 3 + k), suc: s.nombre, ciudad: s.ciudad,
      tipo: tipos[(i + k) % tipos.length], marca: marcas[(i * 2 + k) % marcas.length],
      serie: 'SN' + iRange(r, 100000, 999999), anio: iRange(r, 2015, 2025),
      ultimo: iRange(r, 3, 180), garantia: r() > 0.6,
    })));
  return '<div class="card"><div class="card-head"><h2>Equipos bajo contrato</h2>' +
    '<span class="sub">' + eq.length + ' equipos con historial de mantenimiento</span>' +
    '<div class="right"><button class="btn btn-sm" data-nomock="La carga de equipos">' + icon('plus', 'ic-sm') + 'Agregar equipo</button></div></div>' +
    '<div class="tbl-wrap"><table class="tbl tbl-zebra"><thead><tr>' +
    '<th>Código</th><th>Equipo</th><th>Marca</th><th>N.º de serie</th><th>Sucursal</th>' +
    '<th class="num">Año</th><th class="num">Último mant.</th><th class="c">Garantía</th></tr></thead><tbody>' +
    eq.map(e => '<tr>' +
      '<td class="cell-mono strong">' + e.id + '</td><td>' + e.tipo + '</td><td>' + e.marca + '</td>' +
      '<td class="cell-mono">' + e.serie + '</td>' +
      '<td class="cell-2"><div class="truncate" style="max-width:180px">' + esc(e.suc) + '</div><div class="cell-sub">' + esc(e.ciudad) + '</div></td>' +
      '<td class="num">' + e.anio + '</td>' +
      '<td class="num">' + (e.ultimo > 120 ? '<span style="color:var(--err)">hace ' + e.ultimo + ' d</span>' : 'hace ' + e.ultimo + ' d') + '</td>' +
      '<td class="c">' + (e.garantia ? '<span class="pill pill-ok">Vigente</span>' : '<span class="pill pill-neutral">Vencida</span>') + '</td>' +
      '</tr>').join('') + '</tbody></table></div></div>';
}

function tabDatos() {
  return '<div class="grid g-2" style="align-items:start">' +
    '<div class="card"><div class="card-head"><h3>Datos comerciales</h3>' +
      '<div class="right"><button class="btn btn-sm" data-nomock="La edición de datos">' + icon('edit', 'ic-sm') + 'Editar</button></div></div>' +
      '<div class="card-body"><dl class="dl">' +
      '<dt>Razón social</dt><dd>' + esc(C.nombre) + '</dd>' +
      '<dt>RUC</dt><dd class="mono">' + C.ruc + '</dd>' +
      '<dt>Rubro</dt><dd>' + C.rubro + '</dd>' +
      '<dt>Contacto</dt><dd>' + esc(C.contacto) + '</dd>' +
      '<dt>Teléfono</dt><dd>' + esc(C.tel) + '</dd>' +
      '<dt>Correo</dt><dd>' + esc(C.email) + '</dd>' +
      '<dt>Ejecutivo</dt><dd>' + esc(C.ejecutivo) + '</dd>' +
      '<dt>Cliente desde</dt><dd>' + C.desde + '</dd>' +
      '<dt>Estado</dt><dd>' + (C.estado === 'activo' ? '<span class="pill pill-ok">Activo</span>' : '<span class="pill pill-err">Suspendido</span>') + '</dd>' +
      '</dl>' +
      (C.estado !== 'activo' ? '<div class="note note-err mt12">' + icon('ban') + '<div><b>Cliente bloqueado.</b> ' + esc(C.motivoSuspension) + '</div></div>' : '') +
      '</div></div>' +
    '<div class="card"><div class="card-head"><h3>Condiciones y SLA contratado</h3></div>' +
      '<div class="card-body"><dl class="dl">' +
      '<dt>Condición de pago</dt><dd>' + C.condPago + '</dd>' +
      '<dt>Moneda</dt><dd>' + (C.moneda === 'USD' ? 'Dólares (USD)' : 'Guaraníes (PYG)') + '</dd>' +
      '<dt>Ticket promedio</dt><dd>' + moneyRow(C.ticketProm) + '</dd>' +
      '<dt>SLA correctivo</dt><dd>8 h hábiles</dd>' +
      '<dt>SLA preventivo</dt><dd>72 h hábiles</dd>' +
      '<dt>Cumplimiento</dt><dd><b style="color:' + (C.slaCumpl >= 95 ? 'var(--ok)' : 'var(--warn)') + '">' + C.slaCumpl + ' %</b> últimos 90 días</dd>' +
      '<dt>Penalidad</dt><dd>5 % del valor de la orden por cada 4 h de atraso</dd>' +
      '</dl>' +
      '<div class="note note-neutral mt12">' + icon('shield') +
      '<div>El SLA por tipo de servicio se define en el <a href="catalogos.html">catálogo</a> y puede sobrescribirse por contrato.</div></div>' +
      '</div></div>' +
    '</div>';
}

function tabFacturacion() {
  const r = mkRand(9911);
  const facts = Array.from({ length: 9 }, (_, i) => {
    const monto = +(r() * 4200 + 180).toFixed(2);
    const dias = iRange(r, -40, 75);
    return { n: '001-001-' + String(1230450 + i * 7), fecha: dias, monto, estado: dias > 30 ? 'vencida' : dias > 0 ? 'pendiente' : 'cobrada', ords: iRange(r, 1, 14) };
  });
  const total = facts.filter(f => f.estado !== 'cobrada').reduce((a, f) => a + f.monto, 0);
  return '<div class="card"><div class="card-head"><h2>Facturación</h2>' +
    '<span class="sub">Saldo pendiente ' + usd(total) + ' / ' + pyg(toPyg(total)) + '</span>' +
    '<div class="right"><button class="btn btn-sm" id="bRecordatorio">Enviar recordatorio</button></div></div>' +
    '<div class="tbl-wrap"><table class="tbl"><thead><tr>' +
    '<th>Factura</th><th>Emisión</th><th class="num">Órdenes</th><th class="num">Monto</th><th class="c">Estado</th><th>Vencimiento</th>' +
    '</tr></thead><tbody>' +
    facts.map(f => '<tr>' +
      '<td class="cell-mono strong">' + f.n + '</td>' +
      '<td>hace ' + Math.abs(f.fecha - 30) + ' días</td>' +
      '<td class="num">' + f.ords + '</td>' +
      '<td class="num">' + money(f.monto) + '</td>' +
      '<td class="c">' + (f.estado === 'cobrada' ? '<span class="pill pill-ok">Cobrada</span>' :
        f.estado === 'pendiente' ? '<span class="pill pill-warn">Pendiente</span>' : '<span class="pill pill-err">Vencida</span>') + '</td>' +
      '<td>' + (f.estado === 'vencida' ? '<span style="color:var(--err)">venció hace ' + (f.fecha - 30) + ' días</span>' : 'en ' + Math.abs(30 - f.fecha) + ' días') + '</td>' +
      '</tr>').join('') +
    '</tbody><tfoot><tr><td colspan="3">Saldo pendiente</td><td class="num">' + money(total) + '</td><td colspan="2"></td></tr></tfoot></table></div></div>';
}

function render() {
  renderHead();
  document.getElementById('cuerpo').innerHTML =
    tab === 'sucursales' ? tabSucursales() :
    tab === 'servicios' ? tabServicios() :
    tab === 'equipos' ? tabEquipos() :
    tab === 'datos' ? tabDatos() : tabFacturacion();

  document.querySelectorAll('[data-os]').forEach(tr => tr.onclick = () => abrirServicio(SERVICIOS.find(s => s.id === tr.dataset.os)));
  document.querySelectorAll('[data-suc]').forEach(b => b.onclick = () => {
    const s = C.sucursales.find(x => x.id === b.dataset.suc);
    modal({
      titulo: s.nombre, icon: 'building',
      foot: '<button class="btn" data-close>Cerrar</button><a class="btn btn-primary" href="servicio-nuevo.html">Agendar servicio</a>',
      body: '<dl class="dl">' +
        '<dt>Cliente</dt><dd>' + esc(C.nombre) + '</dd>' +
        '<dt>Dirección</dt><dd>' + esc(s.dir) + ', ' + esc(s.ciudad) + '</dd>' +
        '<dt>Coordenadas</dt><dd>' + (s.geo ? '<span class="mono">' + s.lat + ', ' + s.lng + '</span>' : '<span class="pill pill-warn">Sin cargar</span>') + '</dd>' +
        '<dt>Geocerca</dt><dd>' + (s.geo ? '150 m — check-in validado' : 'no aplicable') + '</dd>' +
        '<dt>Equipos</dt><dd>' + s.equipos + '</dd>' +
        '<dt>Contrato</dt><dd>' + esc(s.contrato) + '</dd>' +
        '<dt>Contacto</dt><dd>' + esc(s.contacto) + ' · ' + esc(s.tel) + '</dd>' +
        '</dl>' +
        (s.geo ? '' : '<div class="note note-warn mt12">' + icon('alert') + '<div>Sin coordenadas no se puede validar el check-in del técnico ni calcular la ruta óptima.</div></div>'),
    });
  });
  document.querySelectorAll('[data-geo]').forEach(b => b.onclick = () => {
    const s = C.sucursales.find(x => x.id === b.dataset.geo);
    if (!s.geo) {
      toastWarn('Sucursal sin coordenadas', esc(s.nombre) + ' no tiene latitud/longitud cargada, no se puede ubicar en el mapa.',
        { code: 'BRANCH_NOT_GEOCODED', origen: 'Ficha de cliente', accion: 'Cargar ahora', onAccion: () => noMock('La carga de coordenadas') });
      return;
    }
    location.href = 'mapa.html';
  });
  document.querySelectorAll('[data-pg]').forEach(b => b.onclick = () => { if (!b.disabled) { sucPage = +b.dataset.pg; render(); } });
  document.querySelectorAll('[data-nomock]').forEach(el => el.onclick = () => noMock(el.dataset.nomock));
  const bs = document.getElementById('bSuc');
  if (bs) bs.onclick = () => noMock('El alta de sucursal');
  const br = document.getElementById('bRecordatorio');
  if (br) br.onclick = () => toastOk('Recordatorio enviado', 'Se envió el estado de cuenta a ' + C.email + ' con copia al ejecutivo ' + C.ejecutivo + '.', { code: 'AR_REMINDER_SENT' });
  repriceAll();
}
render();
</script>
</body>
</html>
