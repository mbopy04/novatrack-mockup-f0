<!DOCTYPE html>
<html lang="es-PY">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Colaboradores · NovaTrack</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232E5BD8'/%3E%3Ctext x='16' y='23' font-family='Arial' font-size='19' font-weight='bold' fill='white' text-anchor='middle'%3EN%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/app.css">
</head>
<body>
<div class="app">
  <div class="brand" id="brand"></div>
  <div class="topbar" id="topbar"></div>
  <nav class="nav" id="nav"></nav>
  <main class="main">
    <div id="head"></div>
    <div class="content"><div id="cuerpo"></div></div>
  </main>
</div>

<script src="assets/data.js"></script>
<script src="assets/app.js"></script>
<script>
boot('colaboradores');

let tab = 'personas';
const S = { q: '', esp: '', jornada: '', soloActivos: false };
const ESPS = [...new Set(COLABORADORES.map(c => c.esp))].sort();

function lista() {
  return COLABORADORES.filter(c =>
    (!S.q || (c.nombre + c.legajo + c.ci).toLowerCase().includes(S.q.toLowerCase())) &&
    (!S.esp || c.esp === S.esp) &&
    (!S.jornada || c.jornada === S.jornada) &&
    (!S.soloActivos || c.activo));
}

function renderHead() {
  const act = COLABORADORES.filter(c => c.activo);
  const enCampo = act.filter(c => c.estado === 'camino' || c.estado === 'trabajando').length;
  const horas = act.reduce((a, c) => a + c.horasMes, 0);
  const gastos = act.reduce((a, c) => a + c.gastosUsd, 0);

  document.getElementById('head').innerHTML = pageHead({
    crumbs: [{ t: 'Maestros' }, { t: 'Colaboradores' }],
    icon: 'users',
    titulo: 'Colaboradores',
    meta: 'Técnicos, ayudantes y jefes de cuadrilla del tenant activo · jornada laboral configurable por persona',
    acciones:
      '<button class="btn" id="bJornadas">' + icon('clock', 'ic-sm') + 'Plantillas de jornada</button>' +
      '<button class="btn" data-nomock="La exportación de la nómina">' + icon('export', 'ic-sm') + 'Exportar</button>' +
      '<button class="btn btn-primary" id="bNuevo">' + icon('plus', 'ic-sm') + 'Nuevo colaborador</button>',
    kpis:
      kpi('Colaboradores', COLABORADORES.length, act.length + ' activos · ' + (COLABORADORES.length - act.length) + ' de baja') +
      kpi('En campo ahora', enCampo, 'en camino o trabajando') +
      kpi('Cuadrillas', CUADRILLAS.filter(c => c.activa).length, 'de ' + CUADRILLAS.length + ' configuradas') +
      kpi('Horas del mes', nfInt.format(horas), 'promedio ' + Math.round(horas / act.length) + ' h por persona') +
      kpi('Gastos rendidos', money(gastos, 'lg left'), 'mes en curso') +
      kpi('SLA del equipo', nf1.format(act.reduce((a, c) => a + c.sla, 0) / act.length) + ' %', 'órdenes dentro de plazo'),
    tabs:
      '<a class="tab' + (tab === 'personas' ? ' active' : '') + '" href="#" data-tab="personas">Personas <span class="pill-n">' + COLABORADORES.length + '</span></a>' +
      '<a class="tab' + (tab === 'cuadrillas' ? ' active' : '') + '" href="#" data-tab="cuadrillas">Cuadrillas <span class="pill-n">' + CUADRILLAS.length + '</span></a>' +
      '<a class="tab' + (tab === 'jornadas' ? ' active' : '') + '" href="#" data-tab="jornadas">Jornadas laborales <span class="pill-n">' + Object.keys(JORNADA_PLANTILLAS).length + '</span></a>' +
      '<a class="tab' + (tab === 'rendimiento' ? ' active' : '') + '" href="#" data-tab="rendimiento">Rendimiento</a>',
  });

  document.querySelectorAll('[data-tab]').forEach(a => a.onclick = e => { e.preventDefault(); tab = a.dataset.tab; render(); });
  document.getElementById('bNuevo').onclick = () => noMock('El alta de colaborador');
  document.getElementById('bJornadas').onclick = () => { tab = 'jornadas'; render(); };
}

/* ============================================================
   Personas
   ============================================================ */
function tabPersonas() {
  const l = lista();
  return '<div class="filters">' +
      '<div class="f-search">' + icon('search', 'ic-sm') + '<input id="q" value="' + esc(S.q) + '" placeholder="Buscar por nombre, legajo o CI…"></div>' +
      '<select class="inp" id="fEsp" style="width:160px;height:30px"><option value="">Todas las especialidades</option>' +
        ESPS.map(e => '<option' + (S.esp === e ? ' selected' : '') + '>' + e + '</option>').join('') + '</select>' +
      '<select class="inp" id="fJor" style="width:200px;height:30px"><option value="">Todas las jornadas</option>' +
        Object.entries(JORNADA_PLANTILLAS).map(([k, j]) => '<option value="' + k + '"' + (S.jornada === k ? ' selected' : '') + '>' + j.nombre + '</option>').join('') + '</select>' +
      '<button class="chip' + (S.soloActivos ? ' on' : '') + '" id="cAct">Solo activos</button>' +
      '<span class="spacer"></span><span class="xsmall muted">' + l.length + ' de ' + COLABORADORES.length + '</span>' +
    '</div>' +
    '<div class="card"><div class="card-head"><h2>Nómina técnica</h2>' +
      '<div class="right">' + legendTecHTML() + '</div></div>' +
      '<div class="tbl-wrap"><table class="tbl tbl-zebra"><thead><tr>' +
        '<th>Colaborador</th><th>Rol / especialidad</th><th>Jornada laboral</th><th>Cuadrilla</th>' +
        '<th>Vehículo</th><th class="c">Estado</th><th class="num">Órd./mes</th><th class="num">Horas</th>' +
        '<th class="num">Gastos</th><th class="num">SLA</th><th style="width:70px"></th>' +
      '</tr></thead><tbody>' +
      l.map(c => {
        const j = JORNADA_PLANTILLAS[c.jornada];
        return '<tr class="clickable" data-c="' + c.id + '">' +
          '<td><div class="who">' + avatar(c.nombre) +
            '<div class="cell-2"><div class="cell-strong">' + esc(c.nombre) + '</div>' +
            '<div class="cell-sub">' + c.legajo + ' · CI ' + c.ci + '</div></div></div></td>' +
          '<td class="cell-2"><div>' + esc(c.rol) + '</div><div class="cell-sub">' + esc(c.esp) +
            (c.cert.length ? ' · <span class="tag">' + c.cert.join('</span> <span class="tag">') + '</span>' : '') + '</div></td>' +
          '<td class="cell-2"><div class="cell-strong">' + j.ini + '–' + j.fin + '</div>' +
            '<div class="cell-sub">' + j.dias.map(d => DOW_S[d]).join(' ') + ' · ' + j.horas + ' h/sem</div></td>' +
          '<td>' + (c.cuadrilla ? '<span class="pill pill-violet">' + esc(c.cuadrilla) + '</span>' : '<span class="muted xsmall">—</span>') + '</td>' +
          '<td class="cell-sub">' + esc(c.vehiculo) + '</td>' +
          '<td class="c">' + (c.activo ? pillTec(c.estado) : '<span class="pill pill-neutral" title="' + esc(c.motivoBaja) + '">De baja</span>') + '</td>' +
          '<td class="num">' + c.servMes + '</td>' +
          '<td class="num">' + c.horasMes + '</td>' +
          '<td class="num">' + money(c.gastosUsd) + '</td>' +
          '<td class="num"><span style="color:' + (c.sla >= 95 ? 'var(--ok)' : c.sla >= 85 ? 'var(--warn)' : 'var(--err)') + '" class="strong">' + c.sla + '%</span></td>' +
          '<td><div class="row-act">' +
            '<button class="btn btn-sm btn-ico" data-jor="' + c.id + '" title="Editar jornada">' + icon('clock', 'ic-sm') + '</button>' +
            '<button class="btn btn-sm btn-ico" data-loc="' + c.id + '" title="Ubicar en el mapa">' + icon('pin', 'ic-sm') + '</button>' +
          '</div></td>' +
        '</tr>';
      }).join('') +
      '</tbody></table></div>' +
      '<div class="card-foot">' + l.length + ' colaboradores · hacé clic en una fila para ver la ficha completa</div>' +
    '</div>';
}

/* ============================================================
   Barra visual de jornada
   ============================================================ */
function jornadaBarra(j) {
  const H0 = 5, H1 = 22, span = H1 - H0;
  const pos = t => ((+t.split(':')[0] + (+t.split(':')[1]) / 60) - H0) / span * 100;
  return '<div class="jornada">' +
    [1, 2, 3, 4, 5, 6, 0].map(d => {
      const trabaja = j.dias.includes(d);
      return '<div class="jornada-day">' + DOW_S[d] + '</div>' +
        '<div class="jornada-bar">' +
        (trabaja
          ? '<div class="jornada-block" style="left:' + pos(j.ini) + '%;width:' + (pos(j.fin) - pos(j.ini)) + '%">' + j.ini + ' – ' + j.fin + '</div>' +
            (j.break ? '<div class="jornada-block break" style="left:' + pos(j.break[0]) + '%;width:' + (pos(j.break[1]) - pos(j.break[0])) + '%"></div>' : '')
          : '<div style="position:absolute;inset:0;display:grid;place-items:center;font-size:9.5px;color:var(--ink-4)">franco</div>') +
        '</div>';
    }).join('') +
    '</div>' +
    '<div class="jornada-scale" style="margin-left:60px;margin-top:3px">' +
      [5, 8, 11, 14, 17, 20, 22].map(h => '<span>' + pad(h) + ':00</span>').join('') + '</div>';
}

/* ============================================================
   Editor de jornada
   ============================================================ */
function editarJornada(c) {
  const j = JSON.parse(JSON.stringify(JORNADA_PLANTILLAS[c.jornada]));
  const bd = modal({
    titulo: 'Jornada laboral — ' + c.nombre, icon: 'clock', size: 'wide',
    foot: '<span class="left xsmall muted">Los cambios afectan la disponibilidad para nuevas asignaciones.</span>' +
      '<button class="btn" data-close>Cancelar</button><button class="btn btn-primary" data-ok>Guardar jornada</button>',
    body:
      '<div class="grid g-2" style="align-items:start">' +
        '<div>' +
          '<div class="field"><label class="lbl">Plantilla</label><select class="inp" id="jPl">' +
            Object.entries(JORNADA_PLANTILLAS).map(([k, v]) => '<option value="' + k + '"' + (k === c.jornada ? ' selected' : '') + '>' + v.nombre + '</option>').join('') +
            '<option value="custom">Personalizada…</option></select>' +
            '<div class="hint">Las plantillas se administran en la pestaña “Jornadas laborales”.</div></div>' +
          '<div class="field"><label class="lbl">Días laborables</label>' +
            '<div class="row wrap" id="jDias">' +
            [1, 2, 3, 4, 5, 6, 0].map(d => '<button class="chip' + (j.dias.includes(d) ? ' on' : '') + '" data-d="' + d + '">' + DOW_S[d] + '</button>').join('') +
            '</div></div>' +
          '<div class="grid g-2">' +
            '<div class="field"><label class="lbl">Entrada</label><input class="inp" type="time" id="jIni" value="' + j.ini + '"></div>' +
            '<div class="field"><label class="lbl">Salida</label><input class="inp" type="time" id="jFin" value="' + j.fin + '"></div>' +
          '</div>' +
          '<div class="field"><label class="chk"><input type="checkbox" id="jBrk"' + (j.break ? ' checked' : '') + '> <span>Tiene pausa de descanso</span></label></div>' +
          '<div class="grid g-2" id="jBrkBox" style="' + (j.break ? '' : 'display:none') + '">' +
            '<div class="field"><label class="lbl">Desde</label><input class="inp" type="time" id="jB0" value="' + (j.break ? j.break[0] : '12:00') + '"></div>' +
            '<div class="field"><label class="lbl">Hasta</label><input class="inp" type="time" id="jB1" value="' + (j.break ? j.break[1] : '13:00') + '"></div>' +
          '</div>' +
          '<div class="grid g-2">' +
            '<div class="field"><label class="lbl">Tolerancia de entrada</label><select class="inp"><option>Sin tolerancia</option><option selected>10 minutos</option><option>15 minutos</option><option>30 minutos</option></select></div>' +
            '<div class="field"><label class="lbl">Horas extra</label><select class="inp"><option selected>Requieren autorización</option><option>Automáticas hasta 2 h</option><option>No permitidas</option></select></div>' +
          '</div>' +
          '<div class="field"><label class="chk"><input type="checkbox"' + (c.jornada === 'guardia' ? ' checked' : '') + '> <span>Disponible para guardia rotativa (fuera de jornada, con recargo)</span></label></div>' +
        '</div>' +
        '<div>' +
          '<div class="lbl">Vista previa semanal</div>' +
          '<div id="jPrev">' + jornadaBarra(j) + '</div>' +
          '<div class="hr"></div>' +
          '<div class="lbl">Impacto</div>' +
          '<dl class="dl">' +
            '<dt>Horas semanales</dt><dd id="jHoras">' + j.horas + ' h</dd>' +
            '<dt>Órdenes afectadas</dt><dd>' + SERVICIOS.filter(s => s.tecnicos.some(t => t.id === c.id) && s.estado === 'asignada').length + ' asignadas a futuro</dd>' +
            '<dt>Cuadrilla</dt><dd>' + (c.cuadrilla || 'sin cuadrilla') + '</dd>' +
          '</dl>' +
          '<div class="note note-warn mt12">' + icon('alert') +
          '<div>Reducir la jornada puede dejar órdenes ya asignadas fuera de horario. El sistema avisa antes de guardar.</div></div>' +
        '</div>' +
      '</div>',
    onOk: b => {
      const ini = b.querySelector('#jIni').value, fin = b.querySelector('#jFin').value;
      const dias = [...b.querySelectorAll('#jDias .chip.on')].map(x => +x.dataset.d);
      if (!dias.length) {
        toastErr('Jornada inválida', 'Seleccioná al menos un día laborable. Un colaborador sin días no puede recibir asignaciones.', { code: 'SHIFT_NO_WORKDAYS', origen: 'Editor de jornada' });
        return false;
      }
      if (ini >= fin) {
        toastErr('Horario inválido', 'La salida (' + fin + ') debe ser posterior a la entrada (' + ini + ').', { code: 'SHIFT_INVALID_RANGE', origen: 'Editor de jornada' });
        return false;
      }
      const afectadas = SERVICIOS.filter(s => s.tecnicos.some(t => t.id === c.id) && s.estado === 'asignada' &&
        (hhmm(s.hIni, s.mIni) < ini || addMin(s.hIni, s.mIni, s.dur) > fin)).length;
      if (afectadas) {
        toastWarn('Jornada guardada con conflictos', 'Se guardó la nueva jornada de ' + c.nombre + ', pero ' + afectadas + ' orden(es) ya asignadas quedan fuera de horario. Revisalas en la agenda.',
          { code: 'SHIFT_SAVED_WITH_CONFLICTS', origen: 'Editor de jornada', sticky: true, accion: 'Ver en la agenda', onAccion: () => location.href = 'agenda.html' });
      } else {
        toastOk('Jornada actualizada', c.nombre + ': ' + dias.map(d => DOW_S[d]).join(' ') + ' de ' + ini + ' a ' + fin + '.', { code: 'SHIFT_UPDATED' });
      }
    },
  });

  const refresh = () => {
    const dias = [...bd.querySelectorAll('#jDias .chip.on')].map(x => +x.dataset.d);
    const ini = bd.querySelector('#jIni').value, fin = bd.querySelector('#jFin').value;
    const brk = bd.querySelector('#jBrk').checked ? [bd.querySelector('#jB0').value, bd.querySelector('#jB1').value] : null;
    const hs = Math.max(0, (+fin.split(':')[0] - +ini.split(':')[0]) - (brk ? 1 : 0)) * dias.length;
    bd.querySelector('#jPrev').innerHTML = jornadaBarra({ dias, ini, fin, break: brk });
    bd.querySelector('#jHoras').textContent = hs + ' h';
  };
  bd.querySelectorAll('#jDias .chip').forEach(ch => ch.onclick = () => { ch.classList.toggle('on'); refresh(); });
  ['#jIni', '#jFin', '#jB0', '#jB1'].forEach(s => bd.querySelector(s).onchange = refresh);
  bd.querySelector('#jBrk').onchange = e => { bd.querySelector('#jBrkBox').style.display = e.target.checked ? '' : 'none'; refresh(); };
  bd.querySelector('#jPl').onchange = e => {
    const p = JORNADA_PLANTILLAS[e.target.value];
    if (!p) { toastInfo('Jornada personalizada', 'Definí los días y horarios manualmente. No se sincronizará con la plantilla.', { code: 'SHIFT_CUSTOM' }); return; }
    bd.querySelector('#jIni').value = p.ini; bd.querySelector('#jFin').value = p.fin;
    bd.querySelector('#jBrk').checked = !!p.break;
    bd.querySelector('#jBrkBox').style.display = p.break ? '' : 'none';
    if (p.break) { bd.querySelector('#jB0').value = p.break[0]; bd.querySelector('#jB1').value = p.break[1]; }
    bd.querySelectorAll('#jDias .chip').forEach(ch => ch.classList.toggle('on', p.dias.includes(+ch.dataset.d)));
    refresh();
  };
}

/* ============================================================
   Ficha del colaborador
   ============================================================ */
function ficha(c) {
  const j = JORNADA_PLANTILLAS[c.jornada];
  const mios = SERVICIOS.filter(s => s.tecnicos.some(t => t.id === c.id)).slice(0, 6);
  modal({
    titulo: c.nombre, icon: 'user', size: 'xwide',
    foot: '<button class="btn left" data-jornada>' + icon('clock', 'ic-sm') + 'Editar jornada</button>' +
      '<button class="btn" data-close>Cerrar</button>' +
      '<button class="btn btn-primary" onclick="location.href=\'mapa.html\'">' + icon('pin', 'ic-sm') + 'Ver en el mapa</button>',
    body:
      '<div class="row wrap mb12">' + (c.activo ? pillTec(c.estado) : '<span class="pill pill-neutral">De baja</span>') +
        '<span class="tag">' + esc(c.rol) + '</span><span class="tag">' + esc(c.esp) + '</span>' +
        (c.cuadrilla ? '<span class="pill pill-violet">' + esc(c.cuadrilla) + '</span>' : '') +
        '<span class="tag">★ ' + c.calif + '</span>' +
        '<span class="spacer"></span>' +
        '<span class="xsmall muted">' + icon('battery', 'ic-sm') + ' ' + c.bateria + '% · último ping hace ' + c.ultimoPing + ' min</span>' +
      '</div>' +
      (c.activo ? '' : '<div class="note note-err mb12">' + icon('ban') + '<div><b>Colaborador de baja.</b> ' + esc(c.motivoBaja) + '</div></div>') +
      '<div class="grid g-3" style="align-items:start">' +
        '<div><div class="lbl">Datos</div><dl class="dl" style="grid-template-columns:92px 1fr">' +
          '<dt>Legajo</dt><dd>' + c.legajo + '</dd>' +
          '<dt>CI</dt><dd class="mono">' + c.ci + '</dd>' +
          '<dt>Teléfono</dt><dd>' + esc(c.tel) + '</dd>' +
          '<dt>Correo</dt><dd class="xsmall">' + esc(c.email) + '</dd>' +
          '<dt>Vehículo</dt><dd>' + esc(c.vehiculo) + '</dd>' +
          '<dt>Base</dt><dd>' + esc(c.ciudad) + '</dd>' +
          '<dt>Ingreso</dt><dd>' + c.desde + '</dd>' +
          '<dt>Certificados</dt><dd>' + (c.cert.length ? c.cert.map(x => '<span class="tag">' + x + '</span>').join(' ') : '<span class="muted">ninguno</span>') + '</dd>' +
        '</dl></div>' +
        '<div><div class="lbl">Jornada — ' + j.nombre + '</div>' + jornadaBarra(j) +
          '<div class="hint mt8">' + j.horas + ' h semanales · pausa ' + (j.break ? j.break[0] + '–' + j.break[1] : 'sin pausa') + '</div></div>' +
        '<div><div class="lbl">Desempeño del mes</div><dl class="dl" style="grid-template-columns:104px 1fr">' +
          '<dt>Órdenes</dt><dd>' + c.servMes + '</dd>' +
          '<dt>Horas</dt><dd>' + c.horasMes + ' h</dd>' +
          '<dt>SLA</dt><dd><b style="color:' + (c.sla >= 95 ? 'var(--ok)' : 'var(--warn)') + '">' + c.sla + ' %</b></dd>' +
          '<dt>Kilometraje</dt><dd>' + nfInt.format(c.km) + ' km</dd>' +
          '<dt>Gastos</dt><dd>' + moneyRow(c.gastosUsd) + '</dd>' +
          '<dt>Calificación</dt><dd>★ ' + c.calif + ' / 5</dd>' +
        '</dl></div>' +
      '</div>' +
      '<div class="lbl mt16">Últimas órdenes</div>' +
      '<table class="tbl tbl-compact"><thead><tr><th>Orden</th><th>Fecha</th><th>Cliente</th><th>Tipo</th><th class="c">Estado</th><th class="num">Monto</th></tr></thead><tbody>' +
      mios.map(s => '<tr><td class="cell-mono">' + s.id + '</td><td>' + fechaCorta(parseISO(s.fecha)) + '</td>' +
        '<td class="truncate" style="max-width:170px">' + esc(s.cliente) + '</td>' +
        '<td class="truncate" style="max-width:170px">' + esc(s.tipo) + '</td>' +
        '<td class="c">' + pill(s.estado) + '</td><td class="num">' + moneyRow(s.montoUsd) + '</td></tr>').join('') +
      '</tbody></table>',
  }).querySelector('[data-jornada]').onclick = function () {
    this.closest('.backdrop').remove(); editarJornada(c);
  };
  repriceAll();
}

/* ============================================================
   Cuadrillas
   ============================================================ */
function tabCuadrillas() {
  return '<div class="grid g-2" style="align-items:start">' +
    CUADRILLAS.map(cu => {
      const ints = COLABORADORES.filter(c => c.cuadrilla === cu.nombre);
      const ords = SERVICIOS.filter(s => s.cuadrilla === cu.nombre).length;
      return '<div class="card"><div class="card-head">' + icon('users') +
        '<h3>' + esc(cu.nombre) + '</h3>' +
        (cu.activa ? '<span class="pill pill-ok">Activa</span>' : '<span class="pill pill-err">Inactiva</span>') +
        '<div class="right"><button class="btn btn-sm" data-cu="' + cu.id + '">' + icon('edit', 'ic-sm') + 'Editar</button></div></div>' +
        '<div class="card-body">' +
          (cu.activa ? '' : '<div class="note note-err mb12">' + icon('ban') + '<div>' + esc(cu.motivo) + '</div></div>') +
          '<dl class="dl">' +
            '<dt>Jefe de cuadrilla</dt><dd>' + esc(cu.jefe) + '</dd>' +
            '<dt>Especialidad</dt><dd>' + esc(cu.esp) + '</dd>' +
            '<dt>Zona</dt><dd>' + esc(cu.zona) + '</dd>' +
            '<dt>Órdenes</dt><dd>' + ords + ' en el período</dd>' +
          '</dl>' +
          '<div class="lbl mt12">Integrantes (' + ints.length + ' de 4 máx.)</div>' +
          (ints.length ? ints.map(c =>
            '<div class="row" style="padding:5px 0;border-bottom:1px solid var(--line-2)" data-c="' + c.id + '">' +
              avatar(c.nombre, 'av-sm') + '<span class="strong small">' + esc(c.nombre) + '</span>' +
              '<span class="tag">' + esc(c.rol) + '</span><span class="spacer"></span>' +
              (c.activo ? pillTec(c.estado) : '<span class="pill pill-neutral">De baja</span>') + '</div>').join('')
            : '<div class="note note-warn">' + icon('alert') + '<div>Cuadrilla sin integrantes: no puede recibir asignaciones.</div></div>') +
        '</div></div>';
    }).join('') +
    '</div>' +
    '<div class="note mt12">' + icon('info') +
    '<div>Una cuadrilla admite de <b>2 a 4 integrantes</b>. El jefe de cuadrilla es quien hace el check-in, recoge la firma del cliente y rinde los gastos del equipo.</div></div>';
}

/* ============================================================
   Plantillas de jornada
   ============================================================ */
function tabJornadas() {
  return '<div class="card"><div class="card-head"><h2>Plantillas de jornada laboral</h2>' +
    '<span class="sub">Se aplican por colaborador y determinan su disponibilidad</span>' +
    '<div class="right"><button class="btn btn-sm btn-primary" data-nomock="El alta de plantilla de jornada">' + icon('plus', 'ic-sm') + 'Nueva plantilla</button></div></div>' +
    '<div class="card-body">' +
      Object.entries(JORNADA_PLANTILLAS).map(([k, j]) => {
        const n = COLABORADORES.filter(c => c.jornada === k).length;
        return '<div style="padding:12px 0;border-bottom:1px solid var(--line-2)">' +
          '<div class="row mb8"><span class="bold">' + j.nombre + '</span>' +
            '<span class="tag">' + j.horas + ' h/semana</span>' +
            '<span class="tag">' + j.dias.length + ' días</span>' +
            '<span class="pill pill-info">' + n + ' colaborador' + (n === 1 ? '' : 'es') + '</span>' +
            '<span class="spacer"></span>' +
            '<button class="btn btn-sm" data-nomock="La edición de la plantilla">' + icon('edit', 'ic-sm') + 'Editar</button>' +
            '<button class="btn btn-sm btn-danger" data-del="' + k + '" data-n="' + n + '">' + icon('trash', 'ic-sm') + '</button></div>' +
          '<div class="grid g-2" style="align-items:start">' + jornadaBarra(j) + '</div>' +
          '</div>';
      }).join('') +
    '</div></div>';
}

/* ============================================================
   Rendimiento
   ============================================================ */
function tabRendimiento() {
  const act = COLABORADORES.filter(c => c.activo).slice().sort((a, b) => b.servMes - a.servMes);
  const max = Math.max(...act.map(c => c.servMes));
  return '<div class="grid g-2" style="align-items:start">' +
    '<div class="card"><div class="card-head">' + icon('chart') + '<h3>Órdenes cerradas por colaborador — mes en curso</h3></div>' +
      '<div class="card-body">' + act.map(c =>
        '<div class="row mb4"><span class="small truncate" style="width:150px">' + esc(c.nombre) + '</span>' +
        '<span class="bar" style="flex:1;height:9px"><span style="width:' + (c.servMes / max * 100) + '%;background:var(--accent)"></span></span>' +
        '<span class="xsmall strong" style="width:26px;text-align:right">' + c.servMes + '</span></div>').join('') +
      '</div></div>' +
    '<div><div class="card"><div class="card-head">' + icon('gauge') + '<h3>Cumplimiento de SLA</h3></div>' +
      '<div class="card-body">' + act.slice(0, 12).map(c =>
        '<div class="row mb4"><span class="small truncate" style="width:150px">' + esc(c.nombre) + '</span>' +
        '<span class="bar" style="flex:1;height:9px"><span style="width:' + c.sla + '%;background:' + (c.sla >= 95 ? 'var(--ok)' : c.sla >= 85 ? 'var(--warn)' : 'var(--err)') + '"></span></span>' +
        '<span class="xsmall strong" style="width:34px;text-align:right">' + c.sla + '%</span></div>').join('') +
      '</div></div>' +
      '<div class="card"><div class="card-head">' + icon('money') + '<h3>Gastos rendidos — mes en curso</h3></div>' +
        '<div class="tbl-wrap"><table class="tbl tbl-compact"><thead><tr><th>Colaborador</th><th class="num">Km</th><th class="num">Gastos</th><th class="num">Prom./orden</th></tr></thead><tbody>' +
        act.slice(0, 10).map(c => '<tr><td class="truncate" style="max-width:150px">' + esc(c.nombre) + '</td>' +
          '<td class="num">' + nfInt.format(c.km) + '</td><td class="num">' + money(c.gastosUsd) + '</td>' +
          '<td class="num">' + money(c.gastosUsd / c.servMes) + '</td></tr>').join('') +
        '</tbody></table></div></div>' +
    '</div></div>';
}

/* ============================================================
   Render
   ============================================================ */
function render() {
  renderHead();
  document.getElementById('cuerpo').innerHTML =
    tab === 'personas' ? tabPersonas() :
    tab === 'cuadrillas' ? tabCuadrillas() :
    tab === 'jornadas' ? tabJornadas() : tabRendimiento();

  const q = document.getElementById('q');
  if (q) { q.oninput = () => { S.q = q.value; render(); document.getElementById('q').focus(); }; }
  const fe = document.getElementById('fEsp'); if (fe) fe.onchange = e => { S.esp = e.target.value; render(); };
  const fj = document.getElementById('fJor'); if (fj) fj.onchange = e => { S.jornada = e.target.value; render(); };
  const ca = document.getElementById('cAct'); if (ca) ca.onclick = () => { S.soloActivos = !S.soloActivos; render(); };

  document.querySelectorAll('tr[data-c]').forEach(tr => tr.onclick = e => {
    if (e.target.closest('.row-act')) return;
    ficha(COLABORADORES.find(c => c.id === tr.dataset.c));
  });
  document.querySelectorAll('div[data-c]').forEach(d => d.onclick = () => ficha(COLABORADORES.find(c => c.id === d.dataset.c)));
  document.querySelectorAll('[data-jor]').forEach(b => b.onclick = e => {
    e.stopPropagation();
    const c = COLABORADORES.find(x => x.id === b.dataset.jor);
    if (!c.activo) {
      toastErr('No se puede editar la jornada', c.nombre + ' está de baja: ' + c.motivoBaja, { code: 'EMPLOYEE_INACTIVE', origen: 'Colaboradores' });
      return;
    }
    editarJornada(c);
  });
  document.querySelectorAll('[data-loc]').forEach(b => b.onclick = e => {
    e.stopPropagation();
    const c = COLABORADORES.find(x => x.id === b.dataset.loc);
    if (!c.activo) {
      toastWarn('Sin posición disponible', c.nombre + ' está de baja y su dispositivo no reporta ubicación.', { code: 'NO_GPS_SIGNAL', origen: 'Mapa' });
      return;
    }
    location.href = 'mapa.html';
  });
  document.querySelectorAll('[data-cu]').forEach(b => b.onclick = () => {
    const cu = CUADRILLAS.find(x => x.id === b.dataset.cu);
    if (!cu.activa) {
      toastErr('Cuadrilla bloqueada', cu.nombre + ': ' + cu.motivo + '. Asigná un jefe de cuadrilla antes de editarla.', { code: 'CREW_NO_LEADER', origen: 'Cuadrillas' });
      return;
    }
    noMock('La edición de cuadrillas');
  });
  document.querySelectorAll('[data-del]').forEach(b => b.onclick = () => {
    const n = +b.dataset.n;
    if (n > 0) {
      toastErr('No se puede eliminar la plantilla', 'La jornada “' + JORNADA_PLANTILLAS[b.dataset.del].nombre + '” está asignada a ' + n + ' colaborador(es). Reasignalos antes de eliminarla.',
        { code: 'SHIFT_TEMPLATE_IN_USE', origen: 'Plantillas de jornada', sticky: true });
      return;
    }
    toastOk('Plantilla eliminada', 'La plantilla no tenía colaboradores asociados.', { code: 'SHIFT_TEMPLATE_DELETED' });
  });
  document.querySelectorAll('[data-nomock]').forEach(el => el.onclick = () => noMock(el.dataset.nomock));
  repriceAll();
}
render();
</script>
</body>
</html>
