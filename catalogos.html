<!DOCTYPE html>
<html lang="es-PY">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Catálogos · NovaTrack</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232E5BD8'/%3E%3Ctext x='16' y='23' font-family='Arial' font-size='19' font-weight='bold' fill='white' text-anchor='middle'%3EN%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/app.css">
</head>
<body>
<div class="app">
  <div class="brand" id="brand"></div>
  <div class="topbar" id="topbar"></div>
  <nav class="nav" id="nav"></nav>
  <main class="main">
    <div id="head"></div>
    <div class="content"><div id="cuerpo"></div></div>
  </main>
</div>

<script src="assets/data.js"></script>
<script src="assets/app.js"></script>
<script>
boot('catalogos');

let tab = 'servicios';
const usoServicio = id => SERVICIOS.filter(s => s.tipoId === id).length;
const usoGasto = nombre => SERVICIOS.reduce((a, s) => a + s.gastos.filter(g => g.tipo === nombre).length, 0);

function renderHead() {
  document.getElementById('head').innerHTML = pageHead({
    crumbs: [{ t: 'Maestros' }, { t: 'Catálogos' }],
    icon: 'catalog',
    titulo: 'Catálogos administrables',
    meta: 'Definen qué se puede agendar, cuánto se cobra y qué gastos se pueden rendir. Los cambios aplican a las órdenes nuevas, nunca a las ya cerradas.',
    acciones:
      '<button class="btn" id="bAudit">' + icon('clock', 'ic-sm') + 'Historial de cambios</button>' +
      '<button class="btn" data-nomock="La importación de catálogos">' + icon('down', 'ic-sm') + 'Importar</button>' +
      '<button class="btn btn-primary" id="bNuevo">' + icon('plus', 'ic-sm') + 'Nuevo ítem</button>',
    kpis:
      kpi('Tipos de servicio', TIPOS_SERVICIO.length, TIPOS_SERVICIO.filter(t => t.activo).length + ' activos') +
      kpi('Tipos de gasto', TIPOS_GASTO.length, TIPOS_GASTO.filter(t => t.activo).length + ' activos') +
      kpi('Categorías', [...new Set(TIPOS_SERVICIO.map(t => t.cat))].length, 'agrupan el catálogo') +
      kpi('Precio promedio', money(TIPOS_SERVICIO.filter(t => t.precio).reduce((a, t) => a + t.precio, 0) / TIPOS_SERVICIO.filter(t => t.precio).length, 'lg left'), 'mano de obra de lista') +
      kpi('Tope de gastos', money(TIPOS_GASTO.reduce((a, t) => a + t.tope, 0), 'lg left'), 'suma de topes vigentes'),
    tabs:
      '<a class="tab' + (tab === 'servicios' ? ' active' : '') + '" href="#" data-tab="servicios">Tipos de servicio <span class="pill-n">' + TIPOS_SERVICIO.length + '</span></a>' +
      '<a class="tab' + (tab === 'gastos' ? ' active' : '') + '" href="#" data-tab="gastos">Tipos de gasto <span class="pill-n">' + TIPOS_GASTO.length + '</span></a>' +
      '<a class="tab' + (tab === 'checklists' ? ' active' : '') + '" href="#" data-tab="checklists">Checklists <span class="pill-n">' + TIPOS_SERVICIO.filter(t => t.activo).length + '</span></a>' +
      '<a class="tab' + (tab === 'monedas' ? ' active' : '') + '" href="#" data-tab="monedas">Monedas y cotización</a>',
  });
  document.querySelectorAll('[data-tab]').forEach(a => a.onclick = e => { e.preventDefault(); tab = a.dataset.tab; render(); });
  document.getElementById('bNuevo').onclick = () => tab === 'gastos' ? formGasto(null) : formServicio(null);
  document.getElementById('bAudit').onclick = () => modal({
    titulo: 'Historial de cambios del catálogo', icon: 'clock', size: 'wide',
    foot: '<button class="btn" data-close>Cerrar</button>',
    body: '<div class="tl">' + [
      ['hace 2 h', 'Mateo Rivas', 'Precio de TS-05 “Correctivo cámara frigorífica” de $ 295,00 a $ 320,00'],
      ['ayer', 'Mateo Rivas', 'TS-11 “Limpieza de conductos” pasó a inactivo'],
      ['hace 4 días', 'Carla Duarte', 'Alta de TG-08 “Estacionamiento” con tope $ 6,00'],
      ['hace 9 días', 'Mateo Rivas', 'TG-09 “Lavado de vehículo” suspendido por política de gastos 2026'],
      ['hace 21 días', 'Mateo Rivas', 'Checklist de TS-04 ampliado de 20 a 24 puntos'],
    ].map(([t, q, d], i) => '<div class="tl-item ' + (i ? 'done' : 'active') + '">' +
      '<div class="tl-time">' + t + ' · ' + q + '</div><div class="tl-txt">' + esc(d) + '</div></div>').join('') + '</div>',
  });
}

/* ============================================================
   Tipos de servicio
   ============================================================ */
function tabServicios() {
  const cats = [...new Set(TIPOS_SERVICIO.map(t => t.cat))];
  return '<div class="card"><div class="card-head"><h2>Tipos de servicio</h2>' +
    '<span class="sub">Definen duración, SLA, precio de lista, checklist y evidencia obligatoria</span>' +
    '<div class="right"><button class="btn btn-sm btn-primary" id="bNS">' + icon('plus', 'ic-sm') + 'Nuevo tipo</button></div></div>' +
    cats.map(cat =>
      '<div><div style="padding:7px 13px;background:var(--surface-2);border-bottom:1px solid var(--line-2);border-top:1px solid var(--line-2)">' +
        '<span class="lbl mb0">' + esc(cat) + '</span> <span class="xsmall muted">' + TIPOS_SERVICIO.filter(t => t.cat === cat).length + ' tipos</span></div>' +
      '<div class="tbl-wrap"><table class="tbl tbl-compact"><thead><tr>' +
        '<th style="width:64px">Código</th><th>Nombre</th><th class="num">Duración</th><th class="num">SLA</th>' +
        '<th class="num">Precio de lista</th><th class="c">Checklist</th><th class="c">Foto</th><th class="c">Firma</th>' +
        '<th class="c">Cuadrilla</th><th class="num">Usos</th><th class="c">Estado</th><th style="width:74px"></th>' +
      '</tr></thead><tbody>' +
      TIPOS_SERVICIO.filter(t => t.cat === cat).map(t => {
        const usos = usoServicio(t.id);
        return '<tr' + (t.activo ? '' : ' style="opacity:.62"') + '>' +
          '<td class="cell-mono strong">' + t.id + '</td>' +
          '<td class="cell-strong">' + esc(t.nombre) +
            (t.activo ? '' : '<div class="cell-sub" style="color:var(--warn)">' + esc(t.motivo) + '</div>') + '</td>' +
          '<td class="num">' + (t.dur >= 60 ? (t.dur / 60).toFixed(1).replace('.0', '') + ' h' : t.dur + ' min') + '</td>' +
          '<td class="num">' + t.sla + ' h</td>' +
          '<td class="num">' + (t.precio ? money(t.precio) : '<span class="pill pill-neutral">No facturable</span>') + '</td>' +
          '<td class="c"><span class="tag">' + t.checklist + '</span></td>' +
          '<td class="c">' + (t.reqFoto ? icon('check', 'ic-sm') : '<span class="muted">—</span>') + '</td>' +
          '<td class="c">' + (t.reqFirma ? icon('check', 'ic-sm') : '<span class="muted">—</span>') + '</td>' +
          '<td class="c">' + (t.cuadrilla ? '<span class="pill pill-violet">Sugerida</span>' : '<span class="muted">—</span>') + '</td>' +
          '<td class="num">' + usos + '</td>' +
          '<td class="c"><label class="sw"><input type="checkbox" data-tog="' + t.id + '"' + (t.activo ? ' checked' : '') + '><span class="track"></span></label></td>' +
          '<td><div class="row-act">' +
            '<button class="btn btn-sm btn-ico" data-edit="' + t.id + '" title="Editar">' + icon('edit', 'ic-sm') + '</button>' +
            '<button class="btn btn-sm btn-ico" data-del="' + t.id + '" data-usos="' + usos + '" title="Eliminar">' + icon('trash', 'ic-sm') + '</button>' +
          '</div></td>' +
        '</tr>';
      }).join('') + '</tbody></table></div></div>').join('') +
    '<div class="card-foot">' + icon('info', 'ic-sm') +
      'Los precios de lista se cargan en USD y se convierten a guaraníes con la cotización vigente (<b class="fx-val"></b> Gs/USD). ' +
      'Cada orden guarda el precio y la cotización del momento en que se creó.</div>' +
    '</div>';
}

function formServicio(t) {
  const nuevo = !t;
  t = t || { id: 'TS-13', nombre: '', dur: 60, sla: 24, precio: 100, cat: 'Climatización', checklist: 8, reqFoto: true, reqFirma: true, activo: true };
  const bd = modal({
    titulo: nuevo ? 'Nuevo tipo de servicio' : 'Editar ' + t.id + ' — ' + t.nombre, icon: 'servicio', size: 'wide',
    foot: (nuevo ? '' : '<span class="left xsmall muted">Usado en ' + usoServicio(t.id) + ' órdenes. Los cambios no afectan órdenes ya cerradas.</span>') +
      '<button class="btn" data-close>Cancelar</button><button class="btn btn-primary" data-ok>Guardar</button>',
    body:
      '<div class="grid g-3">' +
        '<div class="field"><label class="lbl">Código</label><input class="inp" value="' + t.id + '"' + (nuevo ? '' : ' readonly') + '></div>' +
        '<div class="field" style="grid-column:span 2"><label class="lbl">Nombre <span class="req">*</span></label>' +
          '<input class="inp" id="fN" value="' + esc(t.nombre) + '" placeholder="Ej.: Mantenimiento preventivo de chiller"></div>' +
      '</div>' +
      '<div class="grid g-4">' +
        '<div class="field"><label class="lbl">Categoría</label><select class="inp">' +
          [...new Set(TIPOS_SERVICIO.map(x => x.cat))].map(c => '<option' + (c === t.cat ? ' selected' : '') + '>' + c + '</option>').join('') + '</select></div>' +
        '<div class="field"><label class="lbl">Duración estimada</label>' +
          '<div class="inp-group"><input class="inp" type="number" id="fD" value="' + t.dur + '"><span class="addon">min</span></div></div>' +
        '<div class="field"><label class="lbl">SLA de atención</label>' +
          '<div class="inp-group"><input class="inp" type="number" id="fS" value="' + t.sla + '"><span class="addon">h</span></div></div>' +
        '<div class="field"><label class="lbl">Puntos de checklist</label><input class="inp" type="number" value="' + t.checklist + '"></div>' +
      '</div>' +
      '<div class="grid g-2">' +
        '<div class="field"><label class="lbl">Precio de lista (USD) <span class="req">*</span></label>' +
          '<div class="inp-group"><input class="inp" type="number" step="0.01" id="fP" value="' + t.precio + '"><span class="addon">USD</span></div>' +
          '<div class="hint">Equivale a <b id="fPyg">' + pyg(toPyg(t.precio)) + '</b> a la cotización vigente.</div></div>' +
        '<div class="field"><label class="lbl">Precio en guaraníes (referencia)</label>' +
          '<div class="inp-group"><input class="inp" id="fPg" value="' + nfInt.format(toPyg(t.precio)) + '" readonly><span class="addon">Gs.</span></div>' +
          '<div class="hint">Se recalcula automáticamente. Para fijar precio en guaraníes, cambiá la moneda base del tipo.</div></div>' +
      '</div>' +
      '<div class="row wrap mt8">' +
        '<label class="chk"><input type="checkbox"' + (t.reqFoto ? ' checked' : '') + '> <span>Exige fotos de evidencia</span></label>' +
        '<label class="chk"><input type="checkbox"' + (t.reqFirma ? ' checked' : '') + '> <span>Exige firma del cliente</span></label>' +
        '<label class="chk"><input type="checkbox"' + (t.cuadrilla ? ' checked' : '') + '> <span>Sugiere cuadrilla (2–4 personas)</span></label>' +
        '<label class="chk"><input type="checkbox"' + (t.activo ? ' checked' : '') + '> <span>Activo</span></label>' +
      '</div>',
    onOk: b => {
      const n = b.querySelector('#fN').value.trim();
      const p = +b.querySelector('#fP').value;
      const d = +b.querySelector('#fD').value;
      if (!n) { toastErr('Falta el nombre', 'El tipo de servicio necesita un nombre visible para el técnico y para el PDF.', { code: 'CATALOG_NAME_REQUIRED', origen: 'Catálogo' }); return false; }
      if (p < 0) { toastErr('Precio inválido', 'El precio de lista no puede ser negativo. Para servicios sin cargo usá 0 (no facturable).', { code: 'CATALOG_NEGATIVE_PRICE', origen: 'Catálogo' }); return false; }
      if (d < 15) { toastErr('Duración inválida', 'La duración mínima de un servicio es 15 minutos.', { code: 'CATALOG_MIN_DURATION', origen: 'Catálogo' }); return false; }
      toastOk(nuevo ? 'Tipo de servicio creado' : 'Cambios guardados', esc(n) + ' quedó disponible para nuevas órdenes.', { code: 'CATALOG_SAVED' });
    },
  });
  const sync = () => {
    const v = +bd.querySelector('#fP').value || 0;
    bd.querySelector('#fPyg').textContent = pyg(toPyg(v));
    bd.querySelector('#fPg').value = nfInt.format(toPyg(v));
  };
  bd.querySelector('#fP').oninput = sync;
}

/* ============================================================
   Tipos de gasto
   ============================================================ */
function tabGastos() {
  return '<div class="card"><div class="card-head"><h2>Tipos de gasto</h2>' +
    '<span class="sub">Lo que un técnico puede rendir desde la app, con su tope y su comprobante</span>' +
    '<div class="right"><button class="btn btn-sm btn-primary" id="bNG">' + icon('plus', 'ic-sm') + 'Nuevo tipo</button></div></div>' +
    '<div class="tbl-wrap"><table class="tbl tbl-zebra"><thead><tr>' +
      '<th style="width:64px">Código</th><th>Tipo de gasto</th><th class="num">Tope</th><th>Unidad</th>' +
      '<th class="c">Comprobante</th><th class="c">Foto</th><th>Imputa a</th><th>Cuenta contable</th>' +
      '<th class="num">Rendiciones</th><th class="c">Estado</th><th style="width:74px"></th>' +
    '</tr></thead><tbody>' +
    TIPOS_GASTO.map(g => {
      const usos = usoGasto(g.nombre);
      return '<tr' + (g.activo ? '' : ' style="opacity:.62"') + '>' +
        '<td class="cell-mono strong">' + g.id + '</td>' +
        '<td class="cell-strong">' + esc(g.nombre) +
          (g.activo ? '' : '<div class="cell-sub" style="color:var(--warn)">' + esc(g.motivo) + '</div>') + '</td>' +
        '<td class="num">' + money(g.tope) + '</td>' +
        '<td class="cell-sub">' + esc(g.unidad) + '</td>' +
        '<td class="c">' + (g.reqComprobante ? '<span class="pill pill-info">Obligatorio</span>' : '<span class="muted xsmall">Opcional</span>') + '</td>' +
        '<td class="c">' + (g.reqFoto ? icon('camera', 'ic-sm') : '<span class="muted">—</span>') + '</td>' +
        '<td><span class="tag">' + g.imputa + '</span></td>' +
        '<td class="cell-mono">' + g.cuenta + '</td>' +
        '<td class="num">' + usos + '</td>' +
        '<td class="c"><label class="sw"><input type="checkbox" data-togg="' + g.id + '"' + (g.activo ? ' checked' : '') + '><span class="track"></span></label></td>' +
        '<td><div class="row-act">' +
          '<button class="btn btn-sm btn-ico" data-editg="' + g.id + '" title="Editar">' + icon('edit', 'ic-sm') + '</button>' +
          '<button class="btn btn-sm btn-ico" data-delg="' + g.id + '" data-usos="' + usos + '" title="Eliminar">' + icon('trash', 'ic-sm') + '</button>' +
        '</div></td></tr>';
    }).join('') +
    '</tbody></table></div>' +
    '<div class="card-foot">' + icon('info', 'ic-sm') +
    'Un gasto por encima del tope no se bloquea: se registra y queda marcado para aprobación del administrador.</div></div>' +

    '<div class="note note-warn mt12">' + icon('alert') +
    '<div><b>Regla de rendición.</b> Los gastos con comprobante obligatorio no pueden cerrarse sin la foto del ticket. ' +
    'La app impide el check-out y muestra el motivo al técnico — nunca falla en silencio.</div></div>';
}

function formGasto(g) {
  const nuevo = !g;
  g = g || { id: 'TG-10', nombre: '', tope: 20, unidad: 'por servicio', reqComprobante: true, reqFoto: true, cuenta: '5.1.03.', imputa: 'Servicio', activo: true };
  const bd = modal({
    titulo: nuevo ? 'Nuevo tipo de gasto' : 'Editar ' + g.id + ' — ' + g.nombre, icon: 'money', size: 'wide',
    foot: (nuevo ? '' : '<span class="left xsmall muted">' + usoGasto(g.nombre) + ' rendiciones registradas con este tipo.</span>') +
      '<button class="btn" data-close>Cancelar</button><button class="btn btn-primary" data-ok>Guardar</button>',
    body:
      '<div class="grid g-3">' +
        '<div class="field"><label class="lbl">Código</label><input class="inp" value="' + g.id + '"' + (nuevo ? '' : ' readonly') + '></div>' +
        '<div class="field" style="grid-column:span 2"><label class="lbl">Nombre <span class="req">*</span></label>' +
          '<input class="inp" id="gN" value="' + esc(g.nombre) + '" placeholder="Ej.: Peaje ruta interior"></div>' +
      '</div>' +
      '<div class="grid g-3">' +
        '<div class="field"><label class="lbl">Tope (USD) <span class="req">*</span></label>' +
          '<div class="inp-group"><input class="inp" type="number" step="0.5" id="gT" value="' + g.tope + '"><span class="addon">USD</span></div>' +
          '<div class="hint">Equivale a <b id="gPyg">' + pyg(toPyg(g.tope)) + '</b>.</div></div>' +
        '<div class="field"><label class="lbl">Unidad de aplicación</label><select class="inp">' +
          ['por servicio', 'por día', 'por noche', 'por envío', 'por semana'].map(u => '<option' + (u === g.unidad ? ' selected' : '') + '>' + u + '</option>').join('') + '</select></div>' +
        '<div class="field"><label class="lbl">Imputa a</label><select class="inp">' +
          ['Servicio', 'Colaborador', 'Vehículo'].map(u => '<option' + (u === g.imputa ? ' selected' : '') + '>' + u + '</option>').join('') + '</select></div>' +
      '</div>' +
      '<div class="grid g-2">' +
        '<div class="field"><label class="lbl">Cuenta contable</label><input class="inp" value="' + g.cuenta + '"></div>' +
        '<div class="field"><label class="lbl">Aprobación</label><select class="inp">' +
          '<option>Automática hasta el tope</option><option>Siempre requiere aprobación</option><option>Sin aprobación</option></select></div>' +
      '</div>' +
      '<div class="row wrap mt8">' +
        '<label class="chk"><input type="checkbox"' + (g.reqComprobante ? ' checked' : '') + '> <span>Comprobante obligatorio</span></label>' +
        '<label class="chk"><input type="checkbox"' + (g.reqFoto ? ' checked' : '') + '> <span>Foto del ticket obligatoria</span></label>' +
        '<label class="chk"><input type="checkbox"' + (g.activo ? ' checked' : '') + '> <span>Activo</span></label>' +
      '</div>',
    onOk: b => {
      const n = b.querySelector('#gN').value.trim();
      const t = +b.querySelector('#gT').value;
      if (!n) { toastErr('Falta el nombre', 'El tipo de gasto necesita un nombre que el técnico entienda en la app.', { code: 'CATALOG_NAME_REQUIRED', origen: 'Catálogo de gastos' }); return false; }
      if (t <= 0) { toastErr('Tope inválido', 'El tope debe ser mayor que cero. Un tope en cero bloquearía toda rendición de este tipo.', { code: 'CATALOG_ZERO_CAP', origen: 'Catálogo de gastos' }); return false; }
      toastOk(nuevo ? 'Tipo de gasto creado' : 'Cambios guardados', esc(n) + ' con tope de ' + usd(t) + ' / ' + pyg(toPyg(t)) + '.', { code: 'CATALOG_SAVED' });
    },
  });
  bd.querySelector('#gT').oninput = () => { bd.querySelector('#gPyg').textContent = pyg(toPyg(+bd.querySelector('#gT').value || 0)); };
}

/* ============================================================
   Checklists
   ============================================================ */
function tabChecklists() {
  const t = TIPOS_SERVICIO.find(x => x.id === 'TS-05');
  return '<div class="grid g-side-main" style="align-items:start">' +
    '<div class="card"><div class="card-head"><h3>Tipos con checklist</h3></div><div class="card-body p0">' +
      TIPOS_SERVICIO.filter(x => x.activo).map(x =>
        '<div class="row" style="padding:7px 11px;border-bottom:1px solid var(--line-2);cursor:pointer' + (x.id === t.id ? ';background:var(--accent-100)' : '') + '">' +
        '<span class="cell-mono xsmall strong">' + x.id + '</span>' +
        '<span class="small truncate">' + esc(x.nombre) + '</span><span class="spacer"></span>' +
        '<span class="tag">' + x.checklist + '</span></div>').join('') +
    '</div></div>' +
    '<div class="card"><div class="card-head"><h2>' + t.id + ' · ' + esc(t.nombre) + '</h2>' +
      '<span class="sub">' + t.checklist + ' puntos obligatorios antes del check-out</span>' +
      '<div class="right"><button class="btn btn-sm" data-nomock="El reordenamiento de checklist">' + icon('list', 'ic-sm') + 'Reordenar</button>' +
      '<button class="btn btn-sm btn-primary" data-nomock="El alta de punto de checklist">' + icon('plus', 'ic-sm') + 'Agregar punto</button></div></div>' +
      '<div class="tbl-wrap"><table class="tbl tbl-compact"><thead><tr>' +
      '<th style="width:36px">#</th><th>Punto de control</th><th class="c">Tipo de respuesta</th><th class="c">Obligatorio</th><th class="c">Requiere foto</th><th style="width:60px"></th>' +
      '</tr></thead><tbody>' +
      [['Corte de energía y bloqueo del tablero (LOTO)', 'Sí / No', true, true],
       ['Medición de presiones de alta y baja', 'Numérico (bar)', true, true],
       ['Verificación de carga de refrigerante', 'Numérico (kg)', true, false],
       ['Limpieza de condensador y evaporador', 'Sí / No', true, true],
       ['Control de amperaje del compresor', 'Numérico (A)', true, false],
       ['Revisión de aislación de cañerías', 'Sí / No / N.A.', false, false],
       ['Prueba de estanqueidad', 'Sí / No', true, false],
       ['Verificación del sistema de desescarche', 'Sí / No', true, false],
       ['Control y calibración de termostato', 'Numérico (°C)', true, true],
       ['Revisión de burletes y cierre de puerta', 'Sí / No / N.A.', false, true],
       ['Registro de temperatura en régimen', 'Numérico (°C)', true, true],
       ['Ajuste de bornes del contactor', 'Sí / No', true, false],
       ['Limpieza del área de trabajo', 'Sí / No', true, true],
       ['Prueba funcional de 30 min', 'Sí / No', true, false],
       ['Conformidad del responsable de sucursal', 'Firma', true, false]]
      .map(([n, tipo, obl, foto], i) => '<tr>' +
        '<td class="muted num">' + (i + 1) + '</td><td class="cell-strong">' + esc(n) + '</td>' +
        '<td class="c"><span class="tag">' + tipo + '</span></td>' +
        '<td class="c">' + (obl ? '<span class="pill pill-info">Sí</span>' : '<span class="muted xsmall">Opcional</span>') + '</td>' +
        '<td class="c">' + (foto ? icon('camera', 'ic-sm') : '<span class="muted">—</span>') + '</td>' +
        '<td><div class="row-act"><button class="btn btn-sm btn-ico" data-nomock="La edición del punto">' + icon('edit', 'ic-sm') + '</button></div></td>' +
        '</tr>').join('') +
      '</tbody></table></div>' +
      '<div class="card-foot">' + icon('shield', 'ic-sm') + 'Un punto obligatorio sin responder impide el check-out. La app muestra cuál falta.</div>' +
    '</div></div>';
}

/* ============================================================
   Monedas
   ============================================================ */
function tabMonedas() {
  return '<div class="grid g-2" style="align-items:start">' +
    '<div class="card"><div class="card-head">' + icon('money') + '<h3>Monedas del sistema</h3></div>' +
      '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Moneda</th><th>Código</th><th>Símbolo</th><th class="num">Decimales</th><th class="c">Rol</th></tr></thead><tbody>' +
      '<tr><td class="cell-strong">Dólar estadounidense</td><td class="cell-mono">USD</td><td>$</td><td class="num">2</td><td class="c"><span class="pill pill-info">Moneda base</span></td></tr>' +
      '<tr><td class="cell-strong">Guaraní paraguayo</td><td class="cell-mono">PYG</td><td>Gs.</td><td class="num">0</td><td class="c"><span class="pill pill-violet">Moneda local</span></td></tr>' +
      '</tbody></table></div>' +
      '<div class="card-foot">Toda cifra del sistema se muestra en ambas monedas. La moneda base define dónde se guarda el valor original.</div></div>' +

    '<div class="card"><div class="card-head">' + icon('swap') + '<h3>Tipo de cambio</h3>' +
      '<div class="right"><button class="btn btn-sm btn-primary" id="bFx">Editar cotización</button></div></div>' +
      '<div class="card-body">' +
        '<div class="row" style="align-items:baseline;gap:8px">' +
          '<span class="hero num"><b class="fx-val"></b></span>' +
          '<span class="muted">Gs. por USD</span></div>' +
        '<div class="hint">Última actualización: ' + SESSION.fxFecha + ' · fuente: ' + SESSION.fxFuente + '</div>' +
        '<div class="hr"></div>' +
        '<dl class="dl">' +
          '<dt>Política</dt><dd>Carga manual del administrador</dd>' +
          '<dt>Alternativa</dt><dd>Sincronización diaria con la cotización del BCP</dd>' +
          '<dt>Rango admitido</dt><dd>1.000 – 20.000 Gs/USD</dd>' +
          '<dt>Congelamiento</dt><dd>Cada orden guarda la cotización de su fecha de cierre</dd>' +
        '</dl>' +
        '<div class="note note-warn mt12">' + icon('alert') +
        '<div>Cambiar la cotización <b>no</b> recalcula órdenes ya cerradas ni facturas emitidas: el valor histórico queda congelado en el documento.</div></div>' +
      '</div></div>' +

    '<div class="card" style="grid-column:span 2"><div class="card-head">' + icon('calc') + '<h3>Vista previa de conversión</h3>' +
      '<span class="sub">Cómo se ve cada importe del catálogo con la cotización vigente</span></div>' +
      '<div class="tbl-wrap"><table class="tbl tbl-compact"><thead><tr>' +
      '<th>Concepto</th><th class="num">USD</th><th class="num">Guaraníes</th><th class="num">Con IVA 10 % (Gs.)</th></tr></thead><tbody>' +
      TIPOS_SERVICIO.filter(t => t.activo && t.precio).slice(0, 8).map(t => '<tr>' +
        '<td>' + esc(t.nombre) + '</td>' +
        '<td class="num">' + usd(t.precio) + '</td>' +
        '<td class="num" data-pyg-only="' + t.precio + '">' + pyg(toPyg(t.precio)) + '</td>' +
        '<td class="num" data-pyg-only="' + (t.precio * 1.1) + '">' + pyg(toPyg(t.precio * 1.1)) + '</td></tr>').join('') +
      '</tbody></table></div></div>' +
    '</div>';
}

/* ============================================================
   Render
   ============================================================ */
function render() {
  renderHead();
  document.getElementById('cuerpo').innerHTML =
    tab === 'servicios' ? tabServicios() :
    tab === 'gastos' ? tabGastos() :
    tab === 'checklists' ? tabChecklists() : tabMonedas();

  document.querySelectorAll('[data-edit]').forEach(b => b.onclick = () => formServicio(TIPOS_SERVICIO.find(t => t.id === b.dataset.edit)));
  document.querySelectorAll('[data-editg]').forEach(b => b.onclick = () => formGasto(TIPOS_GASTO.find(t => t.id === b.dataset.editg)));
  const bns = document.getElementById('bNS'); if (bns) bns.onclick = () => formServicio(null);
  const bng = document.getElementById('bNG'); if (bng) bng.onclick = () => formGasto(null);

  /* Baja lógica: se explica el motivo, nunca se borra en silencio. */
  document.querySelectorAll('[data-del]').forEach(b => b.onclick = () => {
    const t = TIPOS_SERVICIO.find(x => x.id === b.dataset.del);
    if (+b.dataset.usos > 0) {
      toastErr('No se puede eliminar ' + t.id, '“' + t.nombre + '” está usado en ' + b.dataset.usos + ' órdenes. Eliminarlo rompería el histórico y los PDF emitidos. Desactivalo en lugar de borrarlo.',
        { code: 'CATALOG_ITEM_IN_USE', origen: 'Catálogo de servicios', sticky: true, accion: 'Desactivar', onAccion: () => toastOk('Tipo desactivado', t.nombre + ' ya no aparece al crear órdenes nuevas. El histórico se conserva.', { code: 'CATALOG_DEACTIVATED' }) });
      return;
    }
    toastOk('Tipo eliminado', t.nombre + ' no tenía órdenes asociadas.', { code: 'CATALOG_DELETED' });
  });
  document.querySelectorAll('[data-delg]').forEach(b => b.onclick = () => {
    const g = TIPOS_GASTO.find(x => x.id === b.dataset.delg);
    if (+b.dataset.usos > 0) {
      toastErr('No se puede eliminar ' + g.id, '“' + g.nombre + '” tiene ' + b.dataset.usos + ' rendiciones registradas. Desactivalo para dejar de ofrecerlo en la app sin perder el histórico contable.',
        { code: 'CATALOG_ITEM_IN_USE', origen: 'Catálogo de gastos', sticky: true });
      return;
    }
    toastOk('Tipo de gasto eliminado', g.nombre + ' no tenía rendiciones asociadas.', { code: 'CATALOG_DELETED' });
  });
  document.querySelectorAll('[data-tog]').forEach(ch => ch.onchange = () => {
    const t = TIPOS_SERVICIO.find(x => x.id === ch.dataset.tog);
    if (!ch.checked) {
      const abiertas = SERVICIOS.filter(s => s.tipoId === t.id && s.estado !== 'cerrada').length;
      if (abiertas) {
        toastWarn('Tipo desactivado con órdenes abiertas', t.nombre + ' tiene ' + abiertas + ' órdenes sin cerrar. Podrán completarse, pero ya no se puede crear ninguna nueva.',
          { code: 'CATALOG_DEACTIVATED_WITH_OPEN', origen: 'Catálogo', sticky: true });
        return;
      }
      toastOk('Tipo desactivado', t.nombre + ' ya no aparece al crear órdenes.', { code: 'CATALOG_DEACTIVATED' });
    } else {
      toastOk('Tipo activado', t.nombre + ' vuelve a estar disponible.', { code: 'CATALOG_ACTIVATED' });
    }
  });
  document.querySelectorAll('[data-togg]').forEach(ch => ch.onchange = () => {
    const g = TIPOS_GASTO.find(x => x.id === ch.dataset.togg);
    toastOk(ch.checked ? 'Gasto habilitado' : 'Gasto deshabilitado',
      g.nombre + (ch.checked ? ' vuelve a estar disponible para rendir desde la app.' : ' ya no puede rendirse. Las rendiciones existentes se conservan.'),
      { code: ch.checked ? 'CATALOG_ACTIVATED' : 'CATALOG_DEACTIVATED' });
  });
  document.querySelectorAll('[data-nomock]').forEach(el => el.onclick = () => noMock(el.dataset.nomock));
  const bfx = document.getElementById('bFx'); if (bfx) bfx.onclick = () => document.getElementById('fxBtn').click();
  repriceAll();
}
render();
</script>
</body>
</html>
